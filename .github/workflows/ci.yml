name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate textbooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc

      # No PDF rendering in CI: validate.py only runs build_book.py --check,
      # which needs neither pandoc nor a LaTeX engine.  pandoc is installed so an
      # optional markdown/html smoke build can be added later without changes.
      - name: Run repo-wide validation
        run: python3 tools/validate.py

  quiz:
    name: Quiz (Rust)
    runs-on: ubuntu-latest
    # Only meaningful when the top-level quiz/ workspace is present.
    steps:
      - uses: actions/checkout@v4

      - name: Check for quiz workspace
        id: quiz
        run: |
          if [ -f quiz/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        if: steps.quiz.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        if: steps.quiz.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: quiz

      - name: cargo check
        if: steps.quiz.outputs.present == 'true'
        working-directory: quiz
        run: cargo check --workspace

      - name: cargo test
        if: steps.quiz.outputs.present == 'true'
        working-directory: quiz
        run: cargo test --workspace
