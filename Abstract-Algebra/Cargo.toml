[workspace]
members = [
    "demos/common",
    "demos/visualizer",
    "demos/gui",
    "demos/ch01-logic",
    "demos/ch02-sets",
    "demos/ch03-cardinality",
    "demos/ch04-vector-spaces",
    "demos/ch05-bases-dimension",
    "demos/ch06-linear-maps",
    "demos/ch07-matrices",
    "demos/ch08-determinants",
    "demos/ch09-eigentheory",
    "demos/ch10-canonical-forms",
    "demos/ch11-inner-products",
    "demos/ch12-multilinear",
    "demos/ch13-groups",
    "demos/ch14-cosets",
    "demos/ch15-homomorphisms",
    "demos/ch16-group-actions",
    "demos/ch17-sylow",
    "demos/ch18-group-structure",
    "demos/ch19-abelian-groups",
    "demos/ch20-rings",
    "demos/ch21-ideals",
    "demos/ch22-divisibility",
    "demos/ch23-polynomials",
    "demos/ch24-commutative-algebra",
    "demos/ch25-modules",
    "demos/ch26-projective-injective",
    "demos/ch27-structure-theorem",
    "demos/ch28-tensor-products",
    "demos/ch29-field-extensions",
    "demos/ch30-normal-separable",
    "demos/ch31-galois-theory",
    "demos/ch32-galois-applications",
    "demos/ch33-categories",
    "demos/ch34-yoneda",
    "demos/ch35-adjoints",
    "demos/ch36-limits-colimits",
    "demos/ch37-abelian-categories",
    "demos/ch38-chain-complexes",
    "demos/ch39-resolutions",
    "demos/ch40-ext-tor",
    "demos/ch41-spectral-sequences",
    "demos/ch42-representations",
    "demos/ch43-complete-reducibility",
    "demos/ch44-character-theory",
    "demos/ch45-induced-representations",
    "demos/ch46-lie-groups",
    "demos/ch47-lie-algebras",
    "demos/ch48-solvable-semisimple",
    "demos/ch49-root-systems",
    "demos/ch50-highest-weight",
    "demos/ch51-modular",
    "demos/ch52-geometric",
    "demos/ch53-quantum-groups",
    "demos/ch54-langlands",
]
resolver = "2"

[workspace.dependencies]
common  = { path = "demos/common" }
serde   = { version = "1",    features = ["derive"] }
toml    = "0.8"
image   = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
egui    = "0.28"
eframe  = { version = "0.28", default-features = false,
             features = ["default_fonts", "x11", "wayland"] }
