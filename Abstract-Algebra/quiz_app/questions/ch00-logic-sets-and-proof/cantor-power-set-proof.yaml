kind: proof
difficulty: intermediate
text: "Cantor's Theorem: For any set A, |A| < |P(A)|. That is, there is no surjection from A onto its power set."
proof_lines:
  - "It suffices to show there is no surjection f: A → P(A)."
  - "Given any f: A → P(A), define the diagonal set D = {x ∈ A : x ___ f(x)}."
  - "For any a ∈ A, a ∈ D iff a ∉ f(a), so D ___ f(a) for every a ∈ A."
  - "Thus f is not surjective, and since a trivial injection A → P(A) exists, |A| < |P(A)|."
fills:
  - "∉"
  - "≠"
explanation: >
  The diagonal set D is defined so that x belongs to D precisely when x is not in
  f(x). The fill '∉' encodes this self-referential exclusion. Then for any a, D
  differs from f(a) on membership of a itself, so D ≠ f(a) for all a — the fill '≠'
  captures this mismatch, showing f misses D and hence cannot be surjective.
