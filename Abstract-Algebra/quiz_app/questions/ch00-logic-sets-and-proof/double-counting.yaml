explanation: C(2n,n) counts n-element subsets of {1,…,2n} = {1,…,n} ∪ {n+1,…,2n}.
  Choosing k from the first half and n-k from the second gives C(n,k)·C(n,n-k) = C(n,k)².
  Summing over k gives C(2n,n) = Σ C(n,k)².
