text: "The Law of Excluded Middle asserts that for any proposition P, the disjunction P ∨ ___ is a tautology."
choices:
  - "¬P"
  - "not P"
explanation: "The Law of Excluded Middle states that every proposition is either true or false: P ∨ ¬P holds in every classical interpretation. It is one of the three classical laws of thought, alongside identity and non-contradiction, and it distinguishes classical logic from intuitionistic logic."
