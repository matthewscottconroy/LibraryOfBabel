explanation: 'f⁻¹(S) = {a ∈ A : f(a) ∈ S}. The preimage preserves all set operations:
  f⁻¹(S ∪ T) = f⁻¹(S) ∪ f⁻¹(T), f⁻¹(Sᶜ) = (f⁻¹(S))ᶜ, etc. This makes preimages behave
  better than images under set operations.'
