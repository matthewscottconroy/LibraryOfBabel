explanation: 'Bézout: gcd(a,b) is the smallest positive value of {ax + by : x,y ∈
  ℤ}. The coefficients x,y are computed by back-substitution in the Euclidean algorithm.
  Implies: gcd(a,b) = 1 iff 1 is a ℤ-linear combination of a and b.'
