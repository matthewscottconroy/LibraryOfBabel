text: "The material implication P → Q is false only when P is ___ and Q is false."
choices:
  - "true"
explanation: "In classical logic, P → Q is defined to be false in exactly one case: when the hypothesis P is true and the conclusion Q is false. In all other cases — including when P is false — the implication is vacuously true."
