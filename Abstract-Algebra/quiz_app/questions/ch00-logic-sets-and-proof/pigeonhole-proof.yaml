kind: proof
difficulty: intermediate
text: "Pigeonhole Principle: If n+1 objects are distributed into n boxes, then at least one box contains at least two objects."
proof_lines:
  - "Suppose for contradiction that every box contains ___ object."
  - "Then the total number of objects is at most n · 1 = ___."
  - "But we have n+1 objects, so n+1 ≤ n, a ___."
  - "Therefore at least one box must contain at least two objects."
fills:
  - "at most one"
  - "n"
  - "contradiction"
explanation: >
  The proof proceeds by contradiction. Assuming each of the n boxes holds at most
  one object gives a total capacity of at most n, contradicting the assumption that
  n+1 objects are distributed. The fill 'at most one' sets up the counting bound;
  'n' is the resulting capacity ceiling; 'contradiction' closes the reductio.
tags:
  - pigeonhole
