text: "The notation {x ∈ A : P(x)} is called ___ notation and denotes the subset of A whose elements satisfy property P."
choices:
  - "set-builder"
  - "set builder"
  - "comprehension"
explanation: "Set-builder (or set-comprehension) notation specifies a set by giving a domain A and a predicate P. The result {x ∈ A : P(x)} is guaranteed to be a set by the Axiom Schema of Separation in ZF set theory, avoiding the paradoxes of unrestricted comprehension."
