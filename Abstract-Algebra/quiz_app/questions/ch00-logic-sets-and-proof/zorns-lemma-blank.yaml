text: "Zorn's Lemma states: if every ___ in a partially ordered set has an upper bound, then the set has a maximal element."
choices:
  - "chain"
  - "totally ordered subset"
  - "linearly ordered subset"
explanation: "A chain is a totally ordered subset (every two elements are comparable). Zorn's Lemma — equivalent to the Axiom of Choice — guarantees a maximal element whenever every chain has an upper bound in the poset. It is a primary tool for proving existence results in algebra (e.g., every vector space has a basis)."
