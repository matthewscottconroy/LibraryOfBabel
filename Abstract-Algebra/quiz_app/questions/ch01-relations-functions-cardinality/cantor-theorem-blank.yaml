text: "Cantor's theorem states that for any set A, |A| < |___|."
choices:
  - "P(A)"
  - "the power set of A"
explanation: "Cantor's theorem asserts that the power set P(A) is strictly larger than A in cardinality: there is an injection A → P(A) (sending a to {a}) but no surjection A → P(A). This holds for all sets, finite or infinite, and implies the existence of infinitely many infinite cardinalities."
