explanation: 'Cantor: there is no surjection A → 𝒫(A), hence |A| < |𝒫(A)|. Proof:
  for any f: A → 𝒫(A), the set D = {x ∈ A : x ∉ f(x)} is not in the range of f (diagonalisation).
  Applied to ℕ, |ℕ| < |ℝ| since |ℝ| = |𝒫(ℕ)|.'
