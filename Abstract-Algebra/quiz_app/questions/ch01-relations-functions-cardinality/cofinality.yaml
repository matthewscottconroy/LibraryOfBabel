explanation: 'cf(κ) = min{λ : there exists a cofinal function f: λ → κ}. A cardinal
  is regular if cf(κ) = κ (e.g. ℵ₀, ℵ₁); singular if cf(κ) < κ (e.g. cf(ℵ_ω) = ω).
  Regular uncountable cardinals are used heavily in set theory.'
