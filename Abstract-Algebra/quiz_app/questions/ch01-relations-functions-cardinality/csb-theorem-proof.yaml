kind: proof
difficulty: advanced
text: "Cantor-Schröder-Bernstein Theorem: If there exist injections f: A → B and g: B → A, then there exists a bijection h: A → B."
proof_lines:
  - "Partition A into chains: starting from elements of A \\ g(B), iterate f and g alternately."
  - "Each element of A belongs to exactly one chain, so A = ___ of pairwise disjoint chains."
  - "On each chain, define h to be f if the chain originates in A \\ g(B), and ___ otherwise."
  - "By construction h is injective and surjective onto B, so h is a ___."
fills:
  - "a disjoint union"
  - "g⁻¹"
  - "bijection"
explanation: >
  The chain decomposition partitions A (and B) so that on 'A-chains' (starting outside
  g(B)) the map f already behaves bijectively onto the corresponding B-portion, while on
  'B-chains' one uses the inverse g⁻¹ to travel in the opposite direction. The fill
  'a disjoint union' captures the partition structure. The fill 'g⁻¹' is the critical
  switch: on B-originating chains g is a bijection from that B-portion into A, so g⁻¹
  maps back. Together these piece-wise definitions produce the bijection h.
