text: "The collection of equivalence classes of an equivalence relation ~ on a set A is called the ___ of A induced by ~."
choices:
  - "partition"
  - "quotient set"
  - "quotient"
explanation: "An equivalence relation on A breaks A into disjoint, non-empty subsets — called equivalence classes — whose union is all of A. This collection is the partition of A induced by the relation. The set of equivalence classes is also denoted A/~ and called the quotient set."
