answer: 0
choices:
- a ≤ b iff |a| ≤ |b|
- a ≤ b iff a divides b
- a ≤ b iff a − b ≤ 0
- a ≤ b iff a = b
difficulty: beginner
explanation: 'The relation a ≤ b iff |a| ≤ |b| fails antisymmetry: |1| = |−1| yet
  1 ≠ −1. The other options define valid partial orders on ℤ.'
