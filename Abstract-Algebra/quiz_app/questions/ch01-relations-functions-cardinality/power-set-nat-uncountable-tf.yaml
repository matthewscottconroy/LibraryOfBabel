text: "The power set P(ℕ) has the same cardinality as ℕ."
answer: false
explanation: "By Cantor's theorem, |ℕ| < |P(ℕ)|, so P(ℕ) is strictly larger than ℕ in cardinality. In fact |P(ℕ)| = 2^ℵ₀ = |ℝ|, which is uncountable. This is also witnessed by Cantor's diagonal argument applied directly to binary sequences."
