kind: proof
difficulty: intermediate
text: "ℚ is countably infinite."
proof_lines:
  - "Every rational number can be written as p/q with p ∈ ℤ and q ∈ ℕ, q > 0."
  - "Define f: ℤ × ℕ⁺ → ℚ by f(p, q) = p/q; this map is ___."
  - "Since ℤ and ℕ are both countable, ℤ × ℕ⁺ is ___ (countable product of countable sets)."
  - "The image of f is ℚ, so ℚ is a countable image of a countable set, hence ___."
fills:
  - "surjective"
  - "countable"
  - "countable"
explanation: >
  The key idea is to surject a known countable set onto ℚ. The map f(p,q) = p/q
  is surjective onto ℚ (every rational has such a representation), giving 'surjective'.
  The Cartesian product ℤ × ℕ⁺ is countable because a countable product of countable
  sets is countable, giving the first 'countable'. A surjective image of a countable
  set is countable, completing the argument with the second 'countable'.
