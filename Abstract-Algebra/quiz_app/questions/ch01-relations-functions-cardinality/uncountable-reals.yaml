explanation: '|𝒫(ℕ)| = 2^{ℵ₀} = |ℝ|. The sets ℕ×ℕ, ℚ, and finite subsets of ℕ are
  all countably infinite (cardinality ℵ₀). The continuum |ℝ| = |𝒫(ℕ)| = 2^{ℵ₀} > ℵ₀.'
