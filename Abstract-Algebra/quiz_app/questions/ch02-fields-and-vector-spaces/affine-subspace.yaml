difficulty: intermediate
explanation: Affine subspaces are translates of subspaces. Unlike subspaces, they
  need not contain 0. The cosets of a subspace W form the quotient vector space V/W.
  Lines and planes not through the origin in ℝⁿ are affine subspaces.
