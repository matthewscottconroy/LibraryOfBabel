answer: true
difficulty: intermediate
explanation: In char 0, the map ℤ → F sending n ↦ n·1_F is injective; extending to
  ℚ by m/n ↦ (m·1_F)(n·1_F)⁻¹ gives an embedding ℚ ↪ F. So ℚ is the prime subfield
  of every char-0 field.
