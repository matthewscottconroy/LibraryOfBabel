answer: true
difficulty: beginner
explanation: λ·0 = λ·(0+0) = λ·0 + λ·0; subtracting λ·0 gives 0 = λ·0. Similarly,
  0·v = 0 for any v. These are derived from the distributive axioms; they need not
  be listed separately.
kind: tf
