explanation: By extending a basis of U to a basis of V, we always get a complementary
  subspace (extend {u₁,…,uₖ} to {u₁,…,uₖ,w₁,…,wₘ}; let W = span{wᵢ}). The complement
  is not unique (unlike the orthogonal complement in inner product spaces).
