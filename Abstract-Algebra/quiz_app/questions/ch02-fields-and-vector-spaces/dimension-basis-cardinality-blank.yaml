difficulty: beginner
text: "The dimension of a vector space V is the cardinality of any ___ of V."
choices:
  - "basis"
explanation: "The dimension of V is defined as the common cardinality of all bases of V; the fact that this is well-defined (all bases have the same size) is a theorem. For finite-dimensional spaces this gives a natural number; for infinite-dimensional spaces it is an infinite cardinal."
