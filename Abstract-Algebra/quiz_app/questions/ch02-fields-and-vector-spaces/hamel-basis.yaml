explanation: ℝ over ℚ has uncountable dimension (a Hamel basis has cardinality |ℝ|
  = 2^{ℵ₀}). Its existence requires AC. Most elements of ℝ require infinitely many
  non-zero rational coordinates in any Hamel basis — this is not explicitly constructible.
