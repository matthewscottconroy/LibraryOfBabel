text: "A real vector space equipped with an inner product ⟨·,·⟩ is called an ___."
choices:
  - "inner product space"
  - "pre-Hilbert space"
explanation: "An inner product space (or pre-Hilbert space) is a vector space over ℝ (or ℂ) together with an inner product: a positive-definite, symmetric (resp. conjugate-symmetric), bilinear map. If the space is also complete with respect to the induced norm ‖v‖ = √⟨v,v⟩, it is called a Hilbert space."
