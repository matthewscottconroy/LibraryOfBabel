explanation: 'ℂ cannot be ordered: in any ordered field, −1 < 0, but i² = −1 < 0 and
  (−i)² = −1 < 0 would force −1 to be a sum of squares (positive), contradiction.
  Subfields of ℝ are all orderable.'
