explanation: 'The three elementary row operations correspond to: (1) swap rows i,j
  → permutation matrix; (2) scale row i by c → diagonal matrix Eᵢ(c); (3) add c times
  row j to row i → unit matrix I + cEᵢⱼ. Any invertible matrix is a product of elementaries.'
