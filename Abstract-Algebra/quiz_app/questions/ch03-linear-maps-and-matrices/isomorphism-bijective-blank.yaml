text: "A linear map T: V → W is an isomorphism if and only if it is ___ and ___."
choices:
  - "injective and surjective"
  - "surjective and injective"
  - "bijective"
explanation: "An isomorphism of vector spaces is a linear map that is both injective (one-to-one) and surjective (onto), i.e., a bijective linear map whose inverse is also linear. The linearity of the inverse is automatic for vector spaces over a field, so bijectivity alone characterizes isomorphisms."
