kind: proof
difficulty: intermediate
text: "If A, B ∈ Mₙ(F) and AB = I, then BA = I. (A left inverse of a square matrix is also a right inverse.)"
proof_lines:
  - "From AB = I, taking determinants: det(A)·det(B) = det(I) = ___."
  - "Thus det(A) ≠ 0, so A is ___."
  - "Multiply AB = I on the left by A⁻¹: B = A⁻¹."
  - "Therefore BA = A⁻¹A = ___."
fills:
  - "1"
  - "invertible"
  - "I"
explanation: >
  The fill '1' follows from the multiplicativity of the determinant and det(I) = 1.
  Since the product of det(A) and det(B) is 1 (in particular nonzero), det(A) ≠ 0,
  making A invertible — the fill 'invertible'. Once A has a two-sided inverse A⁻¹,
  we identify B = A⁻¹ from AB = I, and BA = A⁻¹A = I gives the final fill 'I'.
  This argument is specific to square matrices; for non-square matrices a left inverse
  need not be a right inverse.
