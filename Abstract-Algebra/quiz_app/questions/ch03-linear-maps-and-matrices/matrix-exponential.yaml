difficulty: advanced
explanation: 'e^A e^B = e^{A+B} holds when A and B commute (AB = BA), via the BCH
  formula. In general e^A e^B ≠ e^{A+B}. The matrix exponential satisfies: det(e^A)
  = e^{tr A} (Jacobi''s formula).'
