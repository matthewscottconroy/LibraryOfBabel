explanation: When A has full column rank, A⁺ = (AᵀA)⁻¹Aᵀ is the left inverse. The
  least-squares solution to Ax = b is x* = A⁺b = (AᵀA)⁻¹Aᵀb. For full row rank A,
  A⁺ = Aᵀ(AAᵀ)⁻¹.
