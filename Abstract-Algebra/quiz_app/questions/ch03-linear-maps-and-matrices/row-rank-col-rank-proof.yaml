kind: proof
difficulty: intermediate
text: "For any matrix A ∈ Mₘₓₙ(F), the row rank of A equals the column rank of A."
proof_lines:
  - "Let r = row rank(A). Then the row space has dimension r, and A has r linearly independent rows."
  - "By row operations (which do not change the row space), reduce A to row echelon form; the r ___ rows form a basis of the row space."
  - "Each column of A is determined by how it combines the r pivot rows, so the column space has dimension at most ___."
  - "The symmetric argument applied to Aᵀ gives row rank(Aᵀ) = col rank(A) ≤ r, and col rank(Aᵀ) = row rank(A) = r, so col rank(A) = r."
fills:
  - "nonzero"
  - "r"
explanation: >
  Row operations preserve the row space, and the nonzero rows of the row echelon form
  provide an explicit basis — hence 'nonzero'. Each column of A is a linear combination
  of these r basis rows, bounding the column rank by r — hence the second fill 'r'.
  The transpose argument then forces equality. Alternatively one may use the fact that
  A and Aᵀ share the same rank via the SVD or outer-product decomposition.
