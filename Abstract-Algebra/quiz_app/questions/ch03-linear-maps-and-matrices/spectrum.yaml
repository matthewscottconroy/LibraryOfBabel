explanation: 'Spec(T) = {λ ∈ ℂ : det(T − λI) = 0}. Over ℂ, every n×n matrix has exactly
  n eigenvalues (counting algebraic multiplicity) by the fundamental theorem of algebra.
  Over ℝ, the spectrum may require passing to ℂ.'
