answer: 2
choices:
- The sum of its diagonal entries
- The sum of its eigenvalues counting multiplicity
- Both of the above
- The sum of all entries
difficulty: beginner
explanation: Tr(A) equals both the sum of diagonal entries and the sum of all eigenvalues
  (counting algebraic multiplicity). This is because the characteristic polynomial's
  degree-(n−1) coefficient links both.
