explanation: 'Non-degenerate: rad(B) = {v : B(v,w) = 0 ∀w} = {0}. The map φ: v ↦ B(v,−)
  is then injective (hence bijective for finite dim). Non-degenerate ≠ positive definite;
  e.g., the Lorentz metric is non-degenerate but indefinite.'
