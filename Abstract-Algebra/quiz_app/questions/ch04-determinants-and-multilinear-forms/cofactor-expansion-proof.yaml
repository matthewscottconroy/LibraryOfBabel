kind: proof
difficulty: advanced
text: "Theorem: For an n×n matrix A, det(A) = Σⱼ a₁ⱼ·C₁ⱼ, where C₁ⱼ = (-1)^(1+j)·M₁ⱼ is the (1,j)-cofactor and M₁ⱼ is the (1,j)-minor."
proof_lines:
  - "By the Leibniz formula, det(A) = Σ_{σ∈Sₙ} sgn(σ) a_{1,σ(1)} a_{2,σ(2)} ⋯ a_{n,σ(n)}."
  - "Group terms by the value j = σ(1); for each j, σ restricts to a permutation of {2,…,n} on {1,…,n}\\{j}."
  - "The sign satisfies sgn(σ) = (-1)^(1+j) · sgn(σ̃), where σ̃ is the restricted permutation, because moving column j to position 1 requires ___ adjacent transpositions."
  - "Summing over all σ̃ ∈ S_{n-1} gives Σ_{σ̃} sgn(σ̃) ∏_{i≥2} a_{i,σ̃(i)} = ___, the minor determinant."
  - "Collecting over j yields det(A) = Σⱼ a₁ⱼ · (-1)^(1+j) · M₁ⱼ = Σⱼ ___."
fills:
  - "j-1"
  - "M₁ⱼ"
  - "a₁ⱼ · C₁ⱼ"
explanation: >
  The proof derives cofactor expansion directly from the Leibniz formula by grouping permutations
  according to the image of index 1. The sign factor (-1)^(1+j) arises because bringing the j-th
  column to the first position requires exactly j-1 adjacent transpositions.
  The remaining sum over restricted permutations σ̃ is precisely the (1,j)-minor M₁ⱼ.
  The final blank combines a₁ⱼ and C₁ⱼ = (-1)^(1+j)·M₁ⱼ into the cofactor expansion form.
