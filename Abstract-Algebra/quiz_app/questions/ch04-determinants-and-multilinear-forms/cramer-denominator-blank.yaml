text: "By Cramer's rule, the i-th component of the solution to Ax = b is xᵢ = det(Aᵢ) / ___, where Aᵢ is A with column i replaced by b."
choices:
  - "det(A)"
explanation: >
  Cramer's rule states xᵢ = det(Aᵢ)/det(A), where Aᵢ denotes the matrix obtained by replacing
  the i-th column of A with the right-hand side vector b.
  The denominator det(A) must be nonzero for the formula to apply, which is equivalent to A being invertible.
  This provides an explicit closed-form for each component of the solution.
