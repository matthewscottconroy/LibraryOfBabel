explanation: 'Leibniz: det A = Σ_{σ∈Sₙ} sgn(σ) a_{1σ(1)} ⋯ a_{nσ(n)}, summing over
  all permutations σ with sign ±1. This directly shows det is multilinear and alternating.
  For n=2: det[[a,b],[c,d]] = ad − bc.'
