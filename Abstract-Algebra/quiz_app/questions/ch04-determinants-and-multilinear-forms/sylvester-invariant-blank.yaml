text: "Sylvester's law of inertia states that the ___ of a real symmetric bilinear form is a complete invariant under congruence transformations."
choices:
  - "signature"
  - "inertia index"
explanation: >
  The signature of a real symmetric bilinear form is the pair (p, q) where p is the number of positive
  and q the number of negative entries in any diagonal form obtained by a congruence transformation.
  Sylvester's law asserts that this pair is independent of the choice of diagonalising basis, making
  the signature a complete congruence invariant. Two real symmetric forms are congruent if and only
  if they have the same signature.
