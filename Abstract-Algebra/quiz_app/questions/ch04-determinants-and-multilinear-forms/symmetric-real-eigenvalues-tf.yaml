text: "Every real symmetric matrix has real eigenvalues."
answer: true
explanation: >
  A real symmetric matrix A satisfies A = Aᵀ, and in particular A is self-adjoint with respect to the
  standard real inner product. If Av = λv with v ≠ 0, then λ‖v‖² = ⟨λv, v⟩ = ⟨Av, v⟩ = ⟨v, Av⟩ = λ̄‖v‖²,
  forcing λ = λ̄, so λ is real. This is a special case of the spectral theorem for self-adjoint operators.
