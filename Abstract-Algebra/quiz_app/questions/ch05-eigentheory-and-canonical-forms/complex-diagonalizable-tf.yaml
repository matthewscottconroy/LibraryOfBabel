text: "Every matrix over ℂ is diagonalizable."
answer: false
explanation: >
  Not every complex matrix is diagonalizable. A counterexample is the 2×2 Jordan block
  J = [[0,1],[0,0]], which has characteristic polynomial λ² but only a 1-dimensional eigenspace
  for λ = 0, so it cannot be diagonalized. A matrix over ℂ is diagonalizable iff its minimal
  polynomial has no repeated roots (equivalently, iff its geometric and algebraic multiplicities
  agree for every eigenvalue).
