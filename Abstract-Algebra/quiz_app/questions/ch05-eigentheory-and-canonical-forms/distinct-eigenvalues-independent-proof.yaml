kind: proof
difficulty: intermediate
text: "Theorem: Eigenvectors corresponding to distinct eigenvalues of a linear operator T are linearly independent."
proof_lines:
  - "Let v₁, …, vₖ be eigenvectors with distinct eigenvalues λ₁, …, λₖ. Suppose Σᵢ cᵢvᵢ = 0. We induct on k."
  - "Base case k = 1: c₁v₁ = 0 with v₁ ≠ 0 forces c₁ = ___."
  - "Inductive step: apply (T - λₖI) to the relation Σᵢ cᵢvᵢ = 0, giving Σᵢ₌₁^{k-1} cᵢ(λᵢ - λₖ)vᵢ = ___, since (T - λₖI)vₖ = 0."
  - "By the inductive hypothesis, each cᵢ(λᵢ - λₖ) = 0; since λᵢ ≠ λₖ for i < k, we get cᵢ = 0 for all i < k, and then cₖ = ___."
fills:
  - "0"
  - "0"
  - "0"
explanation: >
  The proof uses the operator (T - λₖI) as an annihilator of vₖ, reducing a relation among k eigenvectors
  to one among k-1 eigenvectors. At each stage the differences (λᵢ - λₖ) are nonzero by the distinctness
  hypothesis, forcing each coefficient to vanish. All three blanks are 0: the trivial coefficient in the
  base case, the right-hand side after applying (T - λₖI), and the forced value of cₖ.
