explanation: 'Gershgorin: each eigenvalue lies in at least one disc {z : |z − aᵢᵢ|
  ≤ rᵢ} where rᵢ = Σ_{j≠i} |aᵢⱼ| (row sum of off-diagonal magnitudes). Diagonally
  dominant matrices have all Gershgorin discs away from 0, hence non-singular.'
