difficulty: intermediate
explanation: T-invariant subspaces generalise eigenspaces. Eigenspaces are invariant;
  so are kernels and images of polynomials in T. The existence of a non-trivial invariant
  subspace is equivalent to T having a non-trivial proper invariant subspace.
