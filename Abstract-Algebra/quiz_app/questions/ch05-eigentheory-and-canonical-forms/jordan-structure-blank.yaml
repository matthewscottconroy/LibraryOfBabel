text: "The Jordan normal form of a matrix has its eigenvalues on the diagonal and 0 or 1 on the ___."
choices:
  - "superdiagonal"
  - "first superdiagonal"
explanation: >
  In Jordan normal form each Jordan block Jₖ(λ) is a k×k upper-triangular matrix with λ on every
  diagonal entry and 1 on each entry of the superdiagonal (the diagonal immediately above the main diagonal).
  The 1s on the superdiagonal encode the non-trivial nilpotent part of each Jordan block.
  Off-block entries are all 0.
