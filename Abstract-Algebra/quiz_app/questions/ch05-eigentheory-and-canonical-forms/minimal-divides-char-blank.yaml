text: "The minimal polynomial of an n×n matrix A divides its ___."
choices:
  - "characteristic polynomial"
  - "characteristic polynomial p_A(λ)"
explanation: >
  By the Cayley-Hamilton theorem, every matrix satisfies its characteristic polynomial p_A(λ), so
  p_A is an annihilating polynomial for A. The minimal polynomial m_A is defined as the monic
  polynomial of least degree that annihilates A, and by definition of minimality it must divide any
  annihilating polynomial. Hence m_A divides p_A.
