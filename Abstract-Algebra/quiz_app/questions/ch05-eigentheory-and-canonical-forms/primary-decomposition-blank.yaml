text: "The primary decomposition theorem decomposes V into a direct sum of ___ corresponding to the irreducible factors of the minimal polynomial."
choices:
  - "generalised eigenspaces"
  - "T-invariant subspaces"
explanation: >
  If the minimal polynomial of T factors as m_T(λ) = ∏ᵢ pᵢ(λ)^{aᵢ} over a field, then the primary
  decomposition theorem gives V = ⊕ᵢ Ker(pᵢ(T)^{aᵢ}). Over an algebraically closed field the pᵢ
  are linear factors (λ - λᵢ), and the summands are the generalised eigenspaces Ker(T - λᵢI)^{aᵢ}.
  These subspaces are T-invariant and their direct sum is all of V.
