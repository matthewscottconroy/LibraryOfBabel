text: "The trace of a square matrix equals the sum of its eigenvalues (counted with algebraic multiplicity)."
answer: true
explanation: >
  The characteristic polynomial of an n×n matrix A is p_A(λ) = λⁿ - (tr A)λⁿ⁻¹ + ⋯ + (-1)ⁿ det(A).
  By Vieta's formulas, the sum of the roots (eigenvalues) equals the coefficient of -λⁿ⁻¹, which is
  exactly tr(A). This holds over any algebraically closed field; over other fields it holds provided
  the characteristic polynomial splits completely.
