text: "For a closed subspace W of a Hilbert space, (W⊥)⊥ = W."
answer: true
explanation: >
  In a Hilbert space, the projection theorem gives H = W ⊕ W⊥ for any closed subspace W. Applying
  the same decomposition to W⊥ gives H = (W⊥)⊥ ⊕ W⊥. Since W ⊆ (W⊥)⊥ (every w ∈ W is orthogonal
  to all of W⊥) and both W and (W⊥)⊥ complement W⊥, we get (W⊥)⊥ = W. The closedness of W
  is essential; in a general inner product space (W⊥)⊥ equals the closure of W.
