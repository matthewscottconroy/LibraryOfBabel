choices:
- (I−T)x = y has a unique solution for every y, OR (I−T)x = 0 has non-trivial solutions
- Both (I−T)x = y and (I−T)x = 0 always have solutions
- (I−T) is always invertible
- T must be self-adjoint
difficulty: advanced
explanation: 'Fredholm alternative: either (I−T)x = y has a unique solution for all
  y (kernel trivial), or the homogeneous equation (I−T)x = 0 has non-trivial solutions.
  In the latter case, (I−T)x = y is solvable iff y ⊥ ker(I−T*).'
