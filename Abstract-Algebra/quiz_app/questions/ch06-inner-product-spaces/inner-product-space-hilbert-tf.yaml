text: "Every inner product space is a Hilbert space."
answer: false
explanation: >
  A Hilbert space is an inner product space that is also complete with respect to the norm induced by
  the inner product. Not every inner product space is complete. A classical counterexample is the space
  of polynomials ℝ[x] equipped with the L² inner product ⟨p,q⟩ = ∫₀¹ p(x)q(x) dx; Cauchy sequences
  in this space can converge to non-polynomial functions, which are not in the space.
