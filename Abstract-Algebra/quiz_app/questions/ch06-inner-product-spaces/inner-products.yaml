text: 'The Cauchy-Schwarz inequality states that for vectors u, v in an inner product space:'
explanation: 'Cauchy-Schwarz: |⟨u,v⟩|² ≤ ⟨u,u⟩·⟨v,v⟩. Equality iff u and v are linearly dependent.'
