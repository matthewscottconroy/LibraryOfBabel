text: "By Parseval's identity, for a vector v in a Hilbert space with orthonormal basis {eᵢ}, the norm satisfies ‖v‖² = ___."
choices:
  - "Σᵢ |⟨v, eᵢ⟩|²"
  - "Σ |⟨v, eᵢ⟩|²"
explanation: >
  Parseval's identity states that ‖v‖² = Σᵢ |⟨v, eᵢ⟩|² for any orthonormal basis {eᵢ}.
  The coefficients ⟨v, eᵢ⟩ are the Fourier coefficients of v with respect to the basis.
  This is both a completeness criterion and a generalisation of the Pythagorean theorem: it says
  the squared norm equals the sum of squared Fourier coefficients. In finite dimensions it follows
  directly from expanding ‖v‖² = ⟨Σᵢ⟨v,eᵢ⟩eᵢ, Σⱼ⟨v,eⱼ⟩eⱼ⟩.
