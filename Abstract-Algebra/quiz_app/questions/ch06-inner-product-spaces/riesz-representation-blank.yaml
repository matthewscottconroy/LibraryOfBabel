text: "Every bounded linear functional φ on a Hilbert space H is of the form φ(v) = ⟨v, w⟩ for a unique w ∈ H, by the ___ representation theorem."
choices:
  - "Riesz"
  - "Riesz representation"
explanation: >
  The Riesz representation theorem asserts that the dual space of a Hilbert space H is isometrically
  isomorphic to H itself: every bounded linear functional φ: H → ℂ (or ℝ) is uniquely represented as
  φ(v) = ⟨v, w⟩ for some w ∈ H with ‖φ‖ = ‖w‖. The vector w is sometimes called the Riesz representative
  of φ. This theorem is fundamental for defining adjoints of operators and for the spectral theory of
  self-adjoint operators.
