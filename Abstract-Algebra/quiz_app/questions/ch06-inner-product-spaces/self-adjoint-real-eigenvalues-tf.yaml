text: "Every self-adjoint operator on a complex inner product space has real eigenvalues."
answer: true
explanation: >
  If T = T* and Tv = λv with v ≠ 0, then λ⟨v,v⟩ = ⟨λv, v⟩ = ⟨Tv, v⟩ = ⟨v, T*v⟩ = ⟨v, Tv⟩ = ⟨v, λv⟩ = λ̄⟨v,v⟩.
  Since ⟨v,v⟩ = ‖v‖² > 0 we conclude λ = λ̄, so λ is real.
  This is one of the central properties of self-adjoint operators; it underlies the spectral theorem
  and guarantees that observables in quantum mechanics have real measurement values.
