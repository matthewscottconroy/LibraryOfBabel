explanation: 'Self-adjoint operators satisfy T = T* (T* is the adjoint). Real self-adjoint
  operators are symmetric: Aᵀ = A. The spectral theorem guarantees they have real
  eigenvalues and an orthonormal basis of eigenvectors.'
