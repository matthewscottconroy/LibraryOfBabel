explanation: 'Every self-adjoint operator T on a Hilbert space has a unique spectral
  measure E_T with T = ∫_ℝ λ dE_T(λ). Functional calculus: f(T) = ∫ f(λ) dE_T(λ).
  For compact self-adjoint operators, the PVM is discrete (pure point spectrum).'
