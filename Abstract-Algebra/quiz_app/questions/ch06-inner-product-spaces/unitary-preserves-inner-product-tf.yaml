text: "A unitary operator preserves inner products: ⟨Uu, Uv⟩ = ⟨u, v⟩ for all u, v."
answer: true
explanation: >
  A unitary operator U on a Hilbert space satisfies U*U = UU* = I, where U* is the adjoint.
  Then ⟨Uu, Uv⟩ = ⟨u, U*Uv⟩ = ⟨u, v⟩. This means unitary operators are isometries of the inner
  product structure. In finite dimensions, unitary operators correspond to unitary matrices (complex
  case) or orthogonal matrices (real case), both of which preserve lengths and angles.
