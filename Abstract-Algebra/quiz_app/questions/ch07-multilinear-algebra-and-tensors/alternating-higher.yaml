explanation: d² = 0 makes the de Rham complex a cochain complex. Its cohomology (closed
  forms / exact forms) = de Rham cohomology H*_dR(M), which by de Rham's theorem equals
  singular cohomology H*(M;ℝ). The d² = 0 property is the multilinear algebra source
  of all chain complexes.
