text: "The contraction of a (1,1)-tensor T^i_j over its two indices gives the ___ of the corresponding linear map."
choices:
  - "trace"
explanation: >
  A (1,1)-tensor T^i_j represents a linear endomorphism. The contraction operation sums over a
  paired upper and lower index: Σᵢ T^i_i = tr(T), the trace of the matrix. More generally,
  contraction on a (p,q)-tensor with p,q ≥ 1 lowers both the covariant and contravariant degrees
  by 1, and for the (1,1) case this canonical contraction recovers the trace.
