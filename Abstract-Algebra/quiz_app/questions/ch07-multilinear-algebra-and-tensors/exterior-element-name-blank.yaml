text: "An element of Λᵏ(V) that can be written as v₁ ∧ v₂ ∧ ⋯ ∧ vₖ for vectors v₁,…,vₖ ∈ V is called a ___ k-vector."
choices:
  - "simple"
  - "decomposable"
explanation: >
  A simple (or decomposable) k-vector is one that can be expressed as a single wedge product of k
  vectors. Not all elements of Λᵏ(V) are simple for k ≥ 2 and dim V ≥ 4; a general element is a
  sum of simple k-vectors. The Plücker relations characterise which elements of Λ²(V) are simple.
  Simple k-vectors correspond geometrically to oriented k-dimensional subspaces (k-planes).
