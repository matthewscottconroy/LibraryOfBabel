difficulty: intermediate
text: "Theorem: In the exterior algebra Λ*(V), v ∧ v = 0 for every v ∈ V."
proof_lines:
  - "The exterior algebra Λ*(V) is defined as the quotient of the tensor algebra T(V) by the two-sided ideal I generated by elements of the form v⊗v for v ∈ V."
  - "By definition, the image of v⊗v in the quotient is ___, so v ∧ v = 0 directly from the construction."
  - "Conversely, we can derive v∧w + w∧v = 0 from this: expand (v+w)∧(v+w) = v∧v + ___ + w∧v + w∧w."
  - "Since v∧v = 0 and w∧w = 0, we get 0 = v∧w + w∧v, so ∧ is ___ in every pair of arguments."
fills:
  - "0"
  - "v∧w"
  - "alternating"
explanation: >
  The vanishing v∧v = 0 is built into the definition of the exterior algebra as a quotient of the
  tensor algebra: the ideal I is generated precisely by the squares v⊗v.
  The anticommutativity v∧w = -w∧v is then a derived property: expanding (v+w)∧(v+w) = 0 and
  using v∧v = w∧w = 0 yields v∧w + w∧v = 0. So the alternating property is equivalent to
  anticommutativity in characteristic ≠ 2.
