difficulty: beginner
explanation: V ⊗ W is spanned by simple tensors, but not every element is simple.
  For V = W = ℝ², the tensor v₁⊗w₁ + v₂⊗w₂ (where v₁,v₂ are independent and w₁,w₂
  are independent) is not a simple tensor — the 'matrix' it represents has rank 2.
