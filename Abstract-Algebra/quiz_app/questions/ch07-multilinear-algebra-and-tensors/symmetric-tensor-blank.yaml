text: "A ___ tensor T of type (0,2) satisfies T(v, w) = T(w, v) for all vectors v, w."
choices:
  - "symmetric"
explanation: >
  A covariant 2-tensor T is symmetric if it is unchanged when its two arguments are exchanged.
  In components with respect to a basis, Tᵢⱼ = Tⱼᵢ. Examples include the metric tensor on a
  Riemannian manifold and any bilinear inner product. By contrast, antisymmetric (alternating)
  tensors satisfy T(v,w) = -T(w,v), of which the differential 2-form is a standard example.
