kind: proof
difficulty: advanced
text: "Universal Property of the Tensor Product: For vector spaces V and W, there exists a vector space V⊗W and a bilinear map ⊗: V×W → V⊗W such that for every bilinear map f: V×W → U there is a unique linear map f̃: V⊗W → U with f = f̃ ∘ ⊗."
proof_lines:
  - "Construct V⊗W as the quotient of the free vector space F(V×W) by the subspace R generated by relations encoding bilinearity: (v₁+v₂,w)-(v₁,w)-(v₂,w), (αv,w)-α(v,w), and the analogous relations in the second argument."
  - "Define ⊗(v,w) = [(v,w)], the coset of (v,w) in the quotient. This map is bilinear by construction since the bilinearity relations are ___ in R."
  - "Given any bilinear f: V×W → U, define f̃ on basis elements by f̃([(v,w)]) = ___."
  - "Well-definedness: f̃ is well-defined on the quotient because f is bilinear, so it vanishes on all generators of R; extend linearly to all of V⊗W."
  - "Uniqueness: any linear g: V⊗W → U with g ∘ ⊗ = f must satisfy g(v⊗w) = f(v,w) for all v,w, and since simple tensors ___ V⊗W, g is uniquely determined."
fills:
  - "exact"
  - "f(v,w)"
  - "span"
explanation: >
  The construction quotients the free vector space on V×W by all bilinearity relations.
  The image of (v,w) in the quotient is the simple tensor v⊗w, and bilinearity of ⊗ follows
  because those relations were killed. Any bilinear map f factors through f̃ defined on generators
  by f̃(v⊗w) = f(v,w); well-definedness follows from f killing the relations.
  Uniqueness holds because simple tensors span V⊗W, so a linear map out of V⊗W is determined
  by its values on them.
