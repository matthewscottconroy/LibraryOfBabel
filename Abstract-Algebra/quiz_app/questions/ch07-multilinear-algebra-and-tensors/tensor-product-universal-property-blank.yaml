text: "The tensor product V⊗W is characterised up to isomorphism by the ___ property for bilinear maps: every bilinear map V×W → U factors uniquely through V⊗W."
choices:
  - "universal"
explanation: >
  The universal property characterises the tensor product up to unique isomorphism: V⊗W, together
  with the canonical bilinear map ⊗: V×W → V⊗W, is universal among all bilinear maps out of V×W.
  This means every bilinear f: V×W → U factors as f = f̃ ∘ ⊗ for a unique linear f̃: V⊗W → U.
  The universal property is the conceptually clean definition; the quotient construction is one
  concrete model satisfying it.
tags:
  - tensor-products
