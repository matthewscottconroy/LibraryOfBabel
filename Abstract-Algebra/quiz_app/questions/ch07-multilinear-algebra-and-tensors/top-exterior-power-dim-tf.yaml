text: "Λⁿ(ℝⁿ) is 1-dimensional."
answer: true
explanation: >
  The exterior power Λᵏ(V) has dimension C(n,k) when dim V = n. For k = n, C(n,n) = 1, so Λⁿ(ℝⁿ)
  is 1-dimensional with basis element e₁∧e₂∧⋯∧eₙ. This single basis element represents the
  oriented volume form on ℝⁿ. Any n-form on an n-dimensional space is a scalar multiple of this
  generator, which is why the determinant is essentially unique.
