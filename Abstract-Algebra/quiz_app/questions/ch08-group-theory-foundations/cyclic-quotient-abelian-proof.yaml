kind: proof
difficulty: intermediate
text: "Theorem: If G/Z(G) is cyclic, then G is abelian."
proof_lines:
  - "Let Z = Z(G) and suppose G/Z is cyclic, generated by a coset gZ."
  - "Every element of G can be written as g^i · z for some integer i and some z ∈ ___, because every coset of Z is a power of gZ."
  - "Take any two elements x = g^i z₁ and y = g^j z₂ with z₁, z₂ ∈ Z. Then xy = g^i z₁ g^j z₂ = g^i g^j z₁ z₂, using the fact that elements of Z commute with ___."
  - "Similarly yx = g^j z₂ g^i z₁ = g^(i+j) z₁ z₂. Therefore xy = ___, so G is abelian."
fills:
  - "Z"
  - "everything in G"
  - "yx"
explanation: >
  The key insight is that if G/Z(G) is cyclic then every element of G lies in a coset
  that is a power of the generator, so any two elements share the same power of g up to
  central elements. Because central elements commute with everyone, two arbitrary elements
  commute, making G abelian. This result shows that a non-abelian group must have a
  non-cyclic quotient by its center.
