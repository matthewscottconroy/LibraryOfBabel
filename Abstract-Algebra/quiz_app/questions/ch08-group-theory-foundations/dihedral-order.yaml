text: "What is the order of the dihedral group Dₙ (the symmetry group of a regular n-gon)?"
choices:
  - "2n"
  - "n"
  - "n!"
  - "n²"
answer: 0
explanation: >
  Dₙ consists of n rotations (including the identity) and n reflections, giving 2n
  elements in total. It is generated by a rotation r of order n and a reflection s of
  order 2 satisfying the relation srs⁻¹ = r⁻¹.
