text: "A group G in which every element satisfies g² = e (equivalently, every element is its own inverse) is called an ___ group, and such a group is necessarily abelian."
choices:
  - "elementary abelian 2-group (or: Boolean group)"
  - "involutory group"
explanation: >
  If g² = e for all g, then g = g⁻¹ for every element. For any a, b ∈ G, consider
  (ab)² = e, which gives abab = e, so ab = b⁻¹a⁻¹ = ba. Thus the group is abelian.
  Such groups are elementary abelian 2-groups, isomorphic to a direct product of copies
  of ℤ/2ℤ.
