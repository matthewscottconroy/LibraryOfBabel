explanation: Extensions of Q by N (N abelian) are classified (up to equivalence fixing
  N and Q) by H²(Q,N). Split extensions correspond to the zero class. Non-split extensions
  give interesting groups (e.g., the quaternion group Q₈ is a non-split extension
  of ℤ/2 by ℤ/2).
