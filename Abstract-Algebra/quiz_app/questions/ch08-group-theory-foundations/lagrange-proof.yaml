kind: proof
difficulty: intermediate
text: "Lagrange's Theorem: If G is a finite group and H is a subgroup of G, then |H| divides |G|."
proof_lines:
  - "Define a relation on G by a ~ b iff a⁻¹b ∈ H."
  - "This relation is an equivalence relation, so G is partitioned into ___ of H."
  - "Each coset aH has the same size as H, since the map h ↦ ah is a ___."
  - "If there are k distinct cosets, then |G| = k · ___, so |H| divides |G|."
fills:
  - "cosets"
  - "bijection"
  - "|H|"
explanation: >
  The proof rests on three steps: cosets partition G (from the equivalence relation),
  all cosets have equal size (the left-multiplication bijection h ↦ ah), and so
  |G| = [G:H] · |H|. The blank at step 2 is 'cosets'; step 3 is 'bijection' (showing
  equal size); step 4 is '|H|' (the count formula). Lagrange's theorem follows immediately.
