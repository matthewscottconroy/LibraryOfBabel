text: "For which primes p does every group of order p² have center equal to the entire group?"
choices:
  - "Every prime p — all groups of order p² are abelian"
  - "Only p = 2"
  - "Only odd primes"
  - "No such prime exists"
answer: 0
explanation: >
  For every prime p, any group of order p² is abelian (hence equals its own center).
  This follows because |Z(G)| > 1 for any p-group, so |Z(G)| ∈ {p, p²}; if |Z(G)| = p
  then G/Z(G) is cyclic, forcing G abelian — a contradiction — so |Z(G)| = p² and G = Z(G).
  Both isomorphism types (ℤ/p²ℤ and ℤ/pℤ × ℤ/pℤ) are abelian.
