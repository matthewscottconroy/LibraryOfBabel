text: "The symmetric group Sₙ is simple for all n ≥ 2."
answer: false
explanation: >
  This is false. For n ≥ 2, the alternating group Aₙ is a proper normal subgroup of Sₙ
  (it consists of even permutations and has index 2). For n ≤ 4, Aₙ itself is not simple
  either. Only A₅ and the alternating groups Aₙ for n ≥ 5 are simple. In particular,
  S₃ has a normal subgroup A₃ ≅ ℤ/3ℤ, so S₃ is not simple.
