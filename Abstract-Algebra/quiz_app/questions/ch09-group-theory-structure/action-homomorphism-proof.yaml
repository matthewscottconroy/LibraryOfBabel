difficulty: intermediate
text: "Theorem: If a group G acts on a set X, then the map φ: G → Sym(X) defined by φ(g)(x) = g · x is a group homomorphism."
proof_lines:
  - "For each g ∈ G, define σ_g: X → X by σ_g(x) = g · x. We first show σ_g is a bijection."
  - "σ_g is injective: if g · x = g · y then applying g⁻¹ gives x = g⁻¹ · (g · x) = ___, so x = y."
  - "σ_g is surjective: for any y ∈ X, g⁻¹ · y is a preimage since g · (g⁻¹ · y) = ___ by the associativity axiom of group actions."
  - "Now verify φ is a homomorphism: φ(gh)(x) = (gh) · x = g · (h · x) = σ_g(σ_h(x)) = ___(x)."
fills:
  - "g⁻¹ · (g · y)"
  - "y"
  - "(φ(g) ∘ φ(h))"
explanation: >
  The three blanks establish: (1) injectivity of σ_g by applying the inverse action axiom
  g⁻¹·(g·x) = x; (2) surjectivity using the same axiom in the other direction to confirm
  g·(g⁻¹·y) = y; (3) the homomorphism property, which follows directly from the axiom
  that (gh)·x = g·(h·x), exactly matching composition of permutations φ(g) ∘ φ(h).
