answer: 0
choices:
- Free group F₂ on 2 generators
- ℤ
- Any finite group
- Any abelian group
difficulty: advanced
explanation: Free groups on ≥ 2 generators are not amenable (they contain F₂ as a
  subgroup, and amenability is preserved by subgroups). Amenable groups include finite
  groups, abelian groups, solvable groups, and are closed under extensions and quotients.
  The Banach–Tarski paradox uses non-amenability of SO(3) (which contains F₂).
