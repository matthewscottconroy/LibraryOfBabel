explanation: Aut(ℤ/nℤ) ≅ (ℤ/nℤ)× (invertible elements mod n). An automorphism is determined
  by the image of 1, which must be a generator of ℤ/nℤ, i.e., an element of order
  n, i.e., a unit. |(ℤ/nℤ)×| = φ(n) (Euler's totient).
