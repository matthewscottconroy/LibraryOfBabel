kind: proof
difficulty: advanced
text: "Theorem: The commutator subgroup [G,G] is the unique smallest normal subgroup N of G such that G/N is abelian."
proof_lines:
  - "Let G' = [G,G] be the subgroup generated by all commutators [g,h] = g⁻¹h⁻¹gh."
  - "G' is normal in G: for any x ∈ G, x[g,h]x⁻¹ = [xgx⁻¹, xhx⁻¹] ∈ G', so conjugation preserves ___."
  - "G/G' is abelian: in G/G', the cosets satisfy (gG')(hG') = ghG' = hg[g⁻¹,h⁻¹]G' = ___, since [g⁻¹,h⁻¹] ∈ G'."
  - "Now suppose N ⊲ G with G/N abelian. For all g,h ∈ G, ghN = hgN in G/N, so [g,h] = g⁻¹h⁻¹gh ∈ ___."
  - "Since N contains every commutator and G' is generated by commutators, G' ⊆ N. Thus G' is the ___ such normal subgroup."
fills:
  - "the generating commutators"
  - "(hG')(gG')"
  - "N"
  - "smallest"
explanation: >
  The four blanks hit the essential steps: (1) normality of G' uses the identity
  x[g,h]x⁻¹ = [xgx⁻¹, xhx⁻¹], showing G' is closed under conjugation; (2) G/G' is
  abelian because the commutator [g⁻¹,h⁻¹] lands in G', collapsing the coset difference;
  (3) if G/N is abelian then every commutator lies in N, since abelian means ghN = hgN;
  (4) G' is then the intersection of all such N, making it the smallest one.
