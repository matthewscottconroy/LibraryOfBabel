explanation: 'The Fitting subgroup controls the structure of solvable groups: C_G(F(G))
  ≤ F(G). This means F(G) ''sees'' everything in solvable groups — a key result toward
  the classification framework. For non-solvable groups, one uses the generalized
  Fitting subgroup F*(G).'
