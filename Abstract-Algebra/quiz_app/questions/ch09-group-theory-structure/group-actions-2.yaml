difficulty: intermediate
explanation: 'The orbit Orb(x) = {g·x : g ∈ G} and stabilizer Stab(x) = {g ∈ G : g·x
  = x}. By the bijection Orb(x) ↔ G/Stab(x), |Orb(x)| = |G|/|Stab(x)|, so |Orb(x)|
  · |Stab(x)| = |G|.'
