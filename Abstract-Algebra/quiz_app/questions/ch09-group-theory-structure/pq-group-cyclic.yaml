text: "Every group of order pq (where p < q are distinct primes) is cyclic."
answer: false
explanation: >
  This is false in general. A group of order pq is cyclic if and only if p does not divide
  q - 1. For example, a group of order 6 = 2 · 3 need not be cyclic: S₃ has order 6 and
  is not cyclic (nor abelian). Here p = 2 divides q - 1 = 2, allowing a non-trivial
  semidirect product. When p ∤ (q - 1), Sylow's theorem forces both Sylow subgroups to
  be normal, and the group must be ℤ/pqℤ.
