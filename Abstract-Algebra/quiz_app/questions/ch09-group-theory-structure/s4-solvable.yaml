text: "The symmetric group S₄ is solvable."
answer: true
explanation: >
  S₄ has the normal series S₄ ⊃ A₄ ⊃ V₄ ⊃ {e}, where V₄ = {e,(12)(34),(13)(24),(14)(23)}
  is the Klein four-group. The factors are A₄/V₄ ≅ ℤ/3ℤ, V₄ ≅ ℤ/2ℤ × ℤ/2ℤ, and
  S₄/A₄ ≅ ℤ/2ℤ, all abelian. This reflects the classical fact that quartic equations are
  solvable by radicals. S₅ is not solvable since A₅ is simple and non-abelian.
