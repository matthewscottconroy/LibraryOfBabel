choices:
- (n₁,h₁)(n₂,h₂) = (n₁ · φ(h₁)(n₂), h₁h₂)
- (n₁,h₁)(n₂,h₂) = (n₁n₂, h₁h₂)
- (n₁,h₁)(n₂,h₂) = (n₁φ(h₂)(n₂), h₁h₂)
- (n₁,h₁)(n₂,h₂) = (n₁h₁n₂h₂)
difficulty: advanced
explanation: The semidirect product has underlying set N×H with (n₁,h₁)(n₂,h₂) = (n₁·φ(h₁)(n₂),
  h₁h₂). When φ is trivial this reduces to the direct product. It generalises the
  structure of dihedral groups.
