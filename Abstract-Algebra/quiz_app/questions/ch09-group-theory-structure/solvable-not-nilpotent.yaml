text: "Every solvable group is nilpotent."
answer: false
explanation: >
  This is false. S₃ (the symmetric group on 3 letters) is solvable: it has the subnormal
  series S₃ ⊃ A₃ ⊃ {e} with factors ℤ/2ℤ and ℤ/3ℤ, both abelian. However S₃ is not
  nilpotent: its lower central series is S₃ ⊃ A₃ ⊃ A₃ ⊃ ··· (it stabilizes at A₃ ≠ {e}).
  More generally, any non-abelian group of squarefree order is solvable but not nilpotent.
