explanation: 'For G with |G| = 15 = 3·5: n₃ divides 5 and n₃ ≡ 1 (mod 3), so n₃ =
  1. n₅ divides 3 and n₅ ≡ 1 (mod 5), so n₅ = 1. Unique Sylow subgroups are normal;
  their product gives G ≅ ℤ/3 × ℤ/5 ≅ ℤ/15.'
