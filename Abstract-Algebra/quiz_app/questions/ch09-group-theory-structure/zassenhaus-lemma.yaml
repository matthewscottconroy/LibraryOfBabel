explanation: 'Zassenhaus lemma (butterfly lemma): (V∩Y)/(V∩X)(U∩Y) ≅ (U(V∩Y))/(U(V∩X))
  ≅ (X(Y∩V))/(X(Y∩U)). This algebraic lemma is used to prove the Schreier refinement
  theorem (any two subnormal series have equivalent refinements) and thence Jordan–Hölder.'
