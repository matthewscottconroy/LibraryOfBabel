explanation: Cl(R) = (fractional ideals)/(principal ideals). Cl(R) = 0 iff R is a
  PID (hence UFD). The class number h_K = |Cl(O_K)| for a number field K measures
  how far O_K deviates from a PID; h_K = 1 iff O_K is a UFD.
