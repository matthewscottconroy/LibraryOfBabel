explanation: 'Eisenstein + Gauss: f (primitive over ℤ, Eisenstein at p) is irreducible
  in ℤ[x], hence in ℚ[x]. Classic application: xⁿ − p is irreducible over ℚ for any
  prime p. Used to show [ℚ(ζₚ):ℚ] = p−1 (cyclotomic polynomial).'
