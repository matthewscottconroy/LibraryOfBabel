text: "The ring ℤ[i] of Gaussian integers is a principal ideal domain."
answer: true
explanation: >
  ℤ[i] is a Euclidean domain with norm N(a+bi) = a² + b². Given α, β ∈ ℤ[i] with
  β ≠ 0, one can perform Euclidean division: α = βq + r with N(r) < N(β), by choosing
  q to be a nearest Gaussian integer to α/β. Since every Euclidean domain is a PID,
  ℤ[i] is a PID and in fact a UFD.
