explanation: 'Hensel''s lemma: a simple root mod p lifts uniquely to an exact root
  in ℤ_p. This is ''Newton''s method in the p-adic world''. It shows, for example,
  that ℤ_p contains a (p−1)-th root of unity for p odd (since xᵖ⁻¹ − 1 has p−1 simple
  roots mod p).'
