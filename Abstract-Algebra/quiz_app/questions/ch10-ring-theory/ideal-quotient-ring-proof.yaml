kind: proof
difficulty: intermediate
text: "If I is an ideal of a ring R, then the quotient R/I is a ring under the operations (a+I) + (b+I) = (a+b)+I and (a+I)(b+I) = ab+I."
proof_lines:
  - "The additive group (R/I, +) is already a group since I is a normal subgroup of (R, +)."
  - "Multiplication is well-defined: if a+I = a'+I and b+I = b'+I, write a' = a+s, b' = b+t with s,t ∈ I."
  - "Then a'b' = (a+s)(b+t) = ab + at + sb + st. Since I is closed under multiplication by ring elements, at, sb, st ∈ ___, so a'b' + I = ab + I."
  - "Associativity and distributivity in R/I follow from the same laws in ___ because the coset maps are surjective."
  - "The identity element is ___, since (1+I)(a+I) = 1·a + I = a+I."
fills:
  - "I"
  - "R"
  - "1+I"
explanation: >
  The three blanks capture the key structural facts: (1) well-definedness of multiplication
  requires at, sb, st all lie in I — this uses both left- and right-absorption, the
  defining property of a two-sided ideal; (2) the ring axioms transfer from R because the
  projection π: R → R/I is a surjective ring homomorphism; (3) the multiplicative identity
  in R/I is the coset 1+I containing the identity of R.
