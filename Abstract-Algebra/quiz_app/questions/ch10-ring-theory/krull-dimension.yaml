explanation: 'In ℤ, the chains of primes have length at most 1: (0) ⊊ (p) (prime number).
  So dim ℤ = 1. For a field F, dim F = 0 (only prime is (0)). For F[x₁,…,xₙ], dim
  = n (Hilbert''s Nullstellensatz).'
