kind: proof
difficulty: intermediate
text: "Theorem: Every maximal ideal of a commutative ring R (with 1) is a prime ideal."
proof_lines:
  - "Let M be a maximal ideal of R. Since M is maximal, the quotient ring R/M is a ___."
  - "A field has no zero divisors: if (a+M)(b+M) = 0+M in R/M, then either a+M = 0+M or b+M = 0+M."
  - "Translating back: if ab ∈ M then a ∈ M or ___."
  - "This is precisely the definition of M being a ___ ideal."
fills:
  - "field"
  - "b ∈ M"
  - "prime"
explanation: >
  The key is the correspondence between ideal types and quotient ring types: M is maximal
  iff R/M is a field, and M is prime iff R/M is an integral domain. Since every field is
  an integral domain, maximal implies prime. The converse fails in general: (0) is prime
  but not maximal in ℤ.
