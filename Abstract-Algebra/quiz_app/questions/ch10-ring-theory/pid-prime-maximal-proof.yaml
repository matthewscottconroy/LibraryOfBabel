kind: proof
difficulty: intermediate
text: "Theorem: In a principal ideal domain (PID), every nonzero prime ideal is maximal."
proof_lines:
  - "Let R be a PID and let P = (p) be a nonzero prime ideal, where p is a prime element of R."
  - "Suppose P ⊆ M = (m) for some ideal M. Then p ∈ (m), so p = mr for some r ∈ R."
  - "Since p is prime (hence irreducible in a PID), either m or r is a unit. If r is a unit then (p) = ___, so P = M."
  - "If m is a unit then (m) = ___, which is not a proper ideal, contradicting M being a proper ideal containing P."
  - "Therefore no ideal strictly between P and R exists, so P is ___."
fills:
  - "(m)"
  - "R"
  - "maximal"
explanation: >
  The argument uses the equivalence of prime and irreducible in a PID. If (p) ⊆ (m) then
  m divides p; since p is irreducible, either m is associate to p (giving (m) = (p)) or m
  is a unit (giving (m) = R). This two-case split shows there is no proper ideal strictly
  between (p) and R, so (p) is maximal. The result fails in non-PIDs: in ℤ[x] the prime
  ideal (x) is not maximal.
