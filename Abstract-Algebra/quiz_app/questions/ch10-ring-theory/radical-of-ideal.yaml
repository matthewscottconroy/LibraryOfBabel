text: "The ___ of an ideal I in a commutative ring R consists of all elements r ∈ R such that rⁿ ∈ I for some positive integer n."
choices:
  - "radical"
  - "radical ideal (√I)"
explanation: >
  The radical √I = {r ∈ R | rⁿ ∈ I for some n ≥ 1} is itself an ideal containing I.
  An ideal equal to its own radical is called a radical ideal. By the Nullstellensatz,
  the radical of I equals the intersection of all prime ideals containing I. The nilradical
  of R is the radical of the zero ideal.
