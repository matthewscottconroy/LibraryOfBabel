explanation: 'IJ ⊆ I ∩ J always. When I + J = R (comaximal ideals), IJ = I ∩ J (proof:
  x ∈ I ∩ J, write 1 = a + b with a ∈ I, b ∈ J; then x = xa + xb ∈ JI + IJ ⊆ IJ).
  Key for CRT.'
