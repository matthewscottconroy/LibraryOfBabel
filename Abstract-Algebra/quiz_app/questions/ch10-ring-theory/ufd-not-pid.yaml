text: "Every unique factorization domain (UFD) is a principal ideal domain (PID)."
answer: false
explanation: >
  This is false. The polynomial ring ℤ[x] is a UFD (by Gauss's theorem: if R is a UFD
  then R[x] is a UFD), but it is not a PID. The ideal (2, x) — generated by 2 and x —
  is not a principal ideal in ℤ[x]. More generally, for any UFD R that is not a field,
  R[x] is a UFD but not a PID.
