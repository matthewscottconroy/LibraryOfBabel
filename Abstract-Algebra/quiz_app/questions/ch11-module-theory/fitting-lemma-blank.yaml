text: "Fitting's lemma states that if M is a module of finite ___, then for any endomorphism f: M → M, M decomposes as a direct sum of im(fⁿ) and ker(fⁿ) for sufficiently large n."
choices:
  - "length"
  - "composition length"
explanation: "Fitting's lemma applies to modules of finite length (satisfying both ACC and DCC on submodules). For such a module M and any endomorphism f, the ascending chain ker(f) ⊆ ker(f²) ⊆ ... and descending chain im(f) ⊇ im(f²) ⊇ ... both stabilise. At the stable value n, M = ker(fⁿ) ⊕ im(fⁿ). This yields the Fitting decomposition and implies that endomorphism rings of indecomposable modules of finite length are local."
