text: "Over a principal ideal domain, a module is injective if and only if it is ___."
choices:
  - "divisible"
  - "a divisible module"
explanation: "A module Q over a PID R is injective iff for every r ≠ 0 in R and every q ∈ Q there exists q' ∈ Q with rq' = q (divisibility). The prototypical example is ℚ as a ℤ-module. Baer's criterion reduces injectivity to lifting maps from ideals, and over a PID every ideal is principal, making divisibility the exact condition needed."
