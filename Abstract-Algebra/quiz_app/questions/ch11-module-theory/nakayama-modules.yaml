explanation: Over a local ring, M f.g. is free iff M/mM is free as R/m-module iff
  Tor₁(M,R/m)=0. Nakayama guarantees that a lift of any basis of M/mM to M generates
  M, and if the map is split (Tor = 0), it's a basis.
