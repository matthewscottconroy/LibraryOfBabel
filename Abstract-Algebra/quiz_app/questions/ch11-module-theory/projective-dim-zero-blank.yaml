text: "The projective dimension of an R-module M is 0 if and only if M is ___."
choices:
  - "projective"
  - "a direct summand of a free module"
explanation: "Projective dimension pd(M) is defined as the length of the shortest projective resolution of M. pd(M) = 0 means M itself is projective (i.e., M appears as the 0-th term of its own projective resolution with no further terms). Modules of projective dimension 0 are exactly the projective modules."
