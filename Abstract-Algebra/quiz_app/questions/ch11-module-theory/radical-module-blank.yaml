text: "The ___ of a module M is the intersection of all maximal submodules of M (or M itself if M has no maximal submodules)."
choices:
  - "radical"
  - "Jacobson radical of M"
explanation: "The radical (or Jacobson radical) of a module M, written rad(M), is the intersection of all maximal submodules. It plays the same role for modules as the Jacobson radical J(R) does for a ring R: indeed, rad(M) = J(R)M when M is finitely generated. Nakayama's lemma can be stated as: if M is finitely generated and M = rad(M), then M = 0."
