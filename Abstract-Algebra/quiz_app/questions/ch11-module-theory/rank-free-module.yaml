difficulty: intermediate
explanation: 'For commutative rings, the rank (number of free generators) is well-defined:
  if Rⁿ ≅ Rᵐ then n = m (can be seen by tensoring with a maximal ideal quotient to
  get fields). Non-commutative rings can have Rⁿ ≅ Rᵐ with n ≠ m.'
kind: tf
