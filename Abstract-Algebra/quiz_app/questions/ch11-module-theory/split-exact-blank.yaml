text: "A short exact sequence 0 → A → B → C → 0 ___ if there exists a section s: C → B such that the composite C → B → C is the identity."
choices:
  - "splits"
  - "is split exact"
explanation: "A short exact sequence splits when the surjection B → C has a right inverse (section) s: C → B. Equivalently, there is a retraction r: B → A such that the composite A → B → A is the identity. Either condition implies B ≅ A ⊕ C as modules. Every short exact sequence splits when C is projective or A is injective."
