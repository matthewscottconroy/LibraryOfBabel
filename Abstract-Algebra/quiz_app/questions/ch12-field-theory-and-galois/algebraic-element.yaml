explanation: α is algebraic over K if f(α) = 0 for some f ∈ K[x], f ≠ 0. The minimal
  polynomial m_α is the unique monic irreducible polynomial in K[x] with m_α(α) =
  0. Transcendental elements satisfy no such polynomial.
