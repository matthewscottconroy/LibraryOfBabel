explanation: 'Artin: [L:L^G] = |G| and Gal(L/L^G) = G. This is the converse direction
  to the Fundamental Theorem: given a group of automorphisms, it is the Galois group
  of the extension over the fixed field. Used to show splitting fields are Galois.'
