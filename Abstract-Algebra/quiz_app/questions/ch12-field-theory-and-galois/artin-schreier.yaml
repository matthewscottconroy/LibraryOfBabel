explanation: 'Artin–Schreier: xᵖ − x − a is irreducible over K (char p) iff a ∉ ℘(K)
  = {bᵖ−b : b ∈ K}. The resulting extension has cyclic Galois group ℤ/pℤ. This is
  the char p analogue of taking p-th roots (Kummer theory).'
