explanation: disc(f) = 0 ↔ f and f' have a common root ↔ f has a repeated root (in
  the algebraic closure). For quadratic ax² + bx + c, disc = b² − 4ac. For cubics,
  the sign of the discriminant distinguishes the Galois group (ℤ/3 vs S₃ over ℚ).
