explanation: The number of K-embeddings L → K̄ = [L:K]_s (the separable degree). For
  separable extensions, this equals [L:K]. For Galois extensions, the embeddings are
  exactly Gal(L/K), so |Gal| = [L:K]. Purely inseparable extensions have [L:K]_s =
  1.
