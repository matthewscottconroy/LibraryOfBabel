text: "A finite field GF(pⁿ) has characteristic ___."
choices:
  - "p"
  - "a prime p"
explanation: "The characteristic of a field is the smallest positive integer n such that n·1 = 0, or 0 if no such integer exists. Every finite field has prime characteristic p, and its order is a power of p. Conversely, for every prime p and positive integer n there exists (up to isomorphism) exactly one field of order pⁿ, namely GF(pⁿ) = 𝔽_{pⁿ}."
