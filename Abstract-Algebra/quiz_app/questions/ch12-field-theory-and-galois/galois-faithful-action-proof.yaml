kind: proof
difficulty: advanced
text: "Prove that the Galois group Gal(L/F) of a finite Galois extension acts faithfully on the set of roots of the minimal polynomial of any primitive element."
proof_lines:
  - "Let α be a primitive element for L/F, so L = F(α). Let m(x) ∈ F[x] be the ___ of α over F."
  - "Every σ ∈ Gal(L/F) fixes F pointwise, so applying σ to m(α) = 0 gives m(σ(α)) = 0. Hence σ permutes the ___ of m(x) in L."
  - "The extension is Galois, so m(x) splits completely in L and has [L:F] distinct roots (separability). Since |Gal(L/F)| = ___, the action is on a set of the same size."
  - "Suppose σ ∈ Gal(L/F) fixes every root of m(x). In particular σ(α) = α, and since L = F(α), σ fixes all of L pointwise, so σ = ___."
  - "Therefore the kernel of the action is trivial, and the action is faithful."
fills:
  - "minimal polynomial"
  - "roots"
  - "[L:F]"
  - "id_L"
explanation: >
  The critical deductions are: automorphisms send roots to roots (F-coefficients
  are fixed); the Galois condition (normal + separable) guarantees that m(x)
  splits with distinct roots and that |Gal(L/F)| = [L:F]; and the fact that L is
  generated by α means knowing σ(α) determines σ entirely, so fixing all roots
  forces σ to be the identity.
