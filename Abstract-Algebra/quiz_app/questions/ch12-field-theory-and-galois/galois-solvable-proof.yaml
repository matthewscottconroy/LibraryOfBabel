kind: proof
difficulty: advanced
text: "Prove that a polynomial f ∈ F[x] (char F = 0) is solvable by radicals if and only if its Galois group Gal(f) is a solvable group."
proof_lines:
  - "( ⇒ ) Suppose f is solvable by radicals, so its splitting field L lies inside a radical extension F = F₀ ⊆ F₁ ⊆ ... ⊆ Fₙ where each step Fᵢ = Fᵢ₋₁(αᵢ) with αᵢᵐⁱ ∈ Fᵢ₋₁."
  - "By adjoining appropriate roots of unity (possible in char 0), each Fᵢ/Fᵢ₋₁ can be taken to be a ___ extension, hence its Galois group is cyclic."
  - "The Galois group of the composite radical extension has a subnormal series with ___ quotients corresponding to the Galois groups of the individual radical steps."
  - "Since Gal(L/F) is a quotient of a solvable group (a group with cyclic factors), it is ___."
  - "( ⇐ ) Suppose G = Gal(f) is solvable, with subnormal series G = G₀ ⊇ G₁ ⊇ ... ⊇ Gₖ = {e} with cyclic quotients Gᵢ/Gᵢ₊₁."
  - "By the FTGT each Gᵢ corresponds to a subfield Kᵢ = L^{Gᵢ}, and each extension Kᵢ₊₁/Kᵢ has cyclic Galois group. After adjoining suitable roots of unity, each cyclic extension is a ___ extension by Kummer theory, hence given by a radical."
  - "Therefore the splitting field L is contained in a radical extension of F, so f is solvable by ___."
fills:
  - "cyclic Kummer (radical)"
  - "cyclic"
  - "solvable"
  - "Kummer (pure radical)"
  - "radicals"
explanation: >
  The proof hinges on three key bridges: in char 0, cyclotomic extensions allow
  every cyclic extension to be realised as a Kummer extension (adding an n-th
  root); the Fundamental Theorem of Galois Theory translates subnormal series of
  the Galois group into towers of subfields; and the correspondence between cyclic
  Galois groups and radical extensions in each step of the tower. Solvability of
  the Galois group is precisely the algebraic encoding of this tower structure.
