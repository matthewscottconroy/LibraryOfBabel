explanation: 'Shafarevich: every solvable group is a Galois group over ℚ. All Sₙ and
  Aₙ (n ≥ 5) are realizable. Hilbert showed every group is realizable over ℚ(t). But
  whether every finite group is realizable as Gal(L/ℚ) remains open.'
