text: "An element α ∈ L is algebraic over F if and only if its ___ polynomial over F has finite degree."
choices:
  - "minimal"
  - "irreducible"
explanation: "The minimal polynomial of α over F is the monic polynomial of least degree in F[x] with α as a root; it is irreducible and unique. The degree [F(α):F] equals the degree of this minimal polynomial. If no nonzero polynomial in F[x] vanishes at α, then α is transcendental and no minimal polynomial exists."
