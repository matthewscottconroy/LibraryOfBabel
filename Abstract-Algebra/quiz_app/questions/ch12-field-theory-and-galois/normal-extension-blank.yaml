text: "A field extension L/F is ___ if every irreducible polynomial over F that has at least one root in L splits completely in L."
choices:
  - "normal"
  - "a normal extension"
explanation: "A normal extension is one that is closed under Galois conjugation: if an irreducible polynomial has any root inside L, then all its roots lie in L. Equivalently, L is the splitting field of some family of polynomials over F. Normality, together with separability, is the defining condition for a Galois extension."
