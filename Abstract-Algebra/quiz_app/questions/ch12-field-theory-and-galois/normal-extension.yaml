answer: true
difficulty: intermediate
explanation: A finite extension is normal iff it is the splitting field of a separable
  polynomial over K. Equivalently, every K-embedding L → K̄ has image L itself (L
  is stable under all K-automorphisms of K̄).
kind: tf
tags:
