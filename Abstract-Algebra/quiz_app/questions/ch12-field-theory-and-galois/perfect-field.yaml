explanation: 'Perfect fields: char 0 always perfect; char p perfect iff Frobenius
  is surjective (K = Kᵖ). Finite fields 𝔽_{pⁿ} are perfect (Frobenius is an automorphism).
  An example of a non-perfect field: 𝔽_p(t) (t is not a p-th power).'
