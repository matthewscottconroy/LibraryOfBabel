text: "An algebraic extension L/F is separable if and only if every element of L has a ___ minimal polynomial over F."
choices:
  - "separable"
  - "squarefree"
explanation: "A polynomial is separable if it has no repeated roots in its splitting field, equivalently if gcd(f, f') = 1. An algebraic extension is separable when every element's minimal polynomial is separable. In characteristic 0 all irreducible polynomials are separable, so all algebraic extensions are separable. In characteristic p > 0, inseparability can occur (e.g. the Frobenius-generated extensions)."
