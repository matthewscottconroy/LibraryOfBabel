explanation: 'tr.deg(L/K) is well-defined (any two transcendence bases have the same
  cardinality). Every extension L/K decomposes as: L is algebraic over K(B) where
  B is a transcendence basis. For L = ℂ over ℚ, tr.deg = |ℝ| = 2^{ℵ₀}.'
