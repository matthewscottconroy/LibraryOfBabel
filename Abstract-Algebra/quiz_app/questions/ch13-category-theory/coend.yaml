explanation: Coends generalise colimits by allowing 'twisting'. The tensor product
  M ⊗_R N = ∫^r M(r) ⊗ N(r) as a coend over the R-R bimodule viewpoint. Coends appear
  in Day convolution, Kan extensions, and string diagram calculus.
