explanation: 'Left adjoints preserve all colimits; right adjoints preserve all limits.
  Proof: Hom(F(colim D), c) ≅ Hom(colim D, G(c)) ≅ lim Hom(D(-),G(c)) ≅ lim Hom(FD(-),c).
  Free functors (left adjoints to forgetful functors) thus preserve all colimits.'
