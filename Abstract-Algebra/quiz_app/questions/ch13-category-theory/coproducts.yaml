kind: mc
difficulty: beginner
text: 'In the category of sets, the coproduct of two sets A and B is:'
explanation: Coproducts in Set are disjoint unions; products are Cartesian products.
tags:
- coproducts
- sets
choices:
- A ⊔ B (disjoint union)
- A × B (Cartesian product)
- A ∪ B
- A → B
answer: 0
