kind: proof
difficulty: advanced
text: "Prove that a functor F: C → D is an equivalence of categories if and only if it is full, faithful, and essentially surjective."
proof_lines:
  - "( ⇒ ) Let (F, G, η, ε) be an equivalence, with η: id_C ≅ GF and ε: FG ≅ id_D."
  - "Essential surjectivity: for any D ∈ D, G(D) ∈ C and ε_D: F(G(D)) → D is an ___, so F is essentially surjective."
  - "Faithfulness: if Ff = Fg for f, g: A → B in C, apply G to get GFf = GFg; compose with η gives f = η_B⁻¹ ∘ GFf ∘ η_A = η_B⁻¹ ∘ GFg ∘ η_A = g. So F is ___."
  - "Fullness: given h: FA → FB in D, the map η_B⁻¹ ∘ G(h) ∘ η_A: A → B satisfies F(η_B⁻¹ ∘ G(h) ∘ η_A) = h by naturality, so F is ___."
  - "( ⇐ ) Assume F is full, faithful, essentially surjective. For each D ∈ D choose G(D) ∈ C and ε_D: F(G(D)) ≅ D. For g: D → D', define G(g) as the unique lift through faithfulness and fullness, and set η_A to be the unique iso with F(η_A) = ε_{FA}⁻¹."
  - "Naturality of ε and η follows from fullness/faithfulness, making (F, G, η, ε) an ___ of categories."
fills:
  - "isomorphism"
  - "faithful"
  - "full"
  - "equivalence"
explanation: >
  The forward direction extracts fullness, faithfulness, and essential surjectivity
  from the explicit inverse G and the natural isomorphisms η, ε. The backward
  direction is a construction: essentially surjective gives G on objects (up to
  choice), and full+faithful allows us to define G on morphisms uniquely and
  coherently. The naturality of the resulting η, ε uses faithfulness to verify
  commutativity of the required diagrams.
