text: 'An equivalence of categories is a pair of functors F: C→D, G: D→C with natural isomorphisms GF
  ≅ id_C and FG ≅ id_D. A weaker notion requiring only a ___ functor is called a contravariant isomorphism.'
explanation: Equivalences (both covariant) are weaker than isomorphisms of categories; contravariant equivalences
  are dualities.
tags:
