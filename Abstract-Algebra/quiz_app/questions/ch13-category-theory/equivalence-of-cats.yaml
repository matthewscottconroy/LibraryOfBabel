explanation: 'Equivalence is weaker than isomorphism: we only need G∘F ≅ id (naturally
  isomorphic, not equal). A functor is an equivalence iff it is fully faithful and
  essentially surjective. Most ''same structure'' results in mathematics are equivalences.'
