explanation: 'A group G corresponds to a groupoid BG (the delooping): one object *,
  morphisms Hom(*,*) = G, composition = multiplication. Groupoids generalise groups
  by allowing multiple objects. The fundamental groupoid Π₁(X) has points as objects
  and homotopy classes of paths as morphisms.'
