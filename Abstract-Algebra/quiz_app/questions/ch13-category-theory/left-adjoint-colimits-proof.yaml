kind: proof
difficulty: advanced
text: "Prove that left adjoint functors preserve colimits: if F ⊣ G and D: J → C is a diagram with colimit (L, ι), then F(L) is the colimit of F ∘ D in D."
proof_lines:
  - "Let F: C → D be left adjoint to G: D → C, so there is a natural isomorphism Hom_D(F(-), -) ≅ Hom_C(-, G(-)). Let (L, ιⱼ) = colim D."
  - "To show F(L) = colim(F ∘ D), we must show that for any object X ∈ D, maps from F(L) to X correspond naturally to ___ from F ∘ D to the constant diagram at X."
  - "By the adjunction, Hom_D(F(L), X) ≅ Hom_C(L, ___)."
  - "Since L = colim D, maps L → G(X) correspond naturally to cones from D to the constant diagram at G(X), i.e. to families (fⱼ: D(j) → G(X)) that are ___ with the diagram maps."
  - "By the adjunction again, each fⱼ: D(j) → G(X) corresponds to a map F(D(j)) → X, giving a cocone from F ∘ D to X."
  - "These correspondences are all natural, so Hom_D(F(L), X) ≅ Cocones(F ∘ D, X) naturally in X. By the ___, F(L) is the colimit of F ∘ D."
fills:
  - "cocones"
  - "G(X)"
  - "compatible (natural)"
  - "universal property of colimits"
explanation: >
  The proof is a Yoneda-style argument: rather than constructing the colimit
  directly, we show the hom-set Hom(F(L), X) satisfies the universal property of
  the colimit of F ∘ D. The adjunction translates maps out of F(L) into maps out
  of L, and the universal property of L translates those into compatible families
  of maps from F ∘ D. Naturality in X then applies the Yoneda lemma to conclude.
