difficulty: beginner
explanation: In a one-object category, isomorphisms = invertible elements = units
  of the monoid. If all elements are invertible, the monoid is a group, and the category
  is a groupoid. This single-object viewpoint unifies monoids, groups, and rings (single-object
  Ab-enriched categories).
