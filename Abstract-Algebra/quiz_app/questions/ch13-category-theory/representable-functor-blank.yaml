text: "A functor F: C → Set is representable if there exists an object A ∈ C and a natural isomorphism F ≅ ___."
choices:
  - "Hom_C(A, -)"
  - "よ(A)"
explanation: "A representable functor is one naturally isomorphic to a hom-functor Hom(A, -) for some object A, called the representing object. By the Yoneda lemma, the representing object is unique up to unique isomorphism, and the representation corresponds to a universal element x ∈ F(A). Examples: the forgetful functor from groups to sets is represented by ℤ (the free group on one generator); the functor assigning to each ring its set of ideals is not representable."
