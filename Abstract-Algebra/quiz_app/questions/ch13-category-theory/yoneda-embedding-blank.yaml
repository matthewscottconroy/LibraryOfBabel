text: "The Yoneda embedding sends each object A ∈ C to the representable functor ___ : C → Set."
choices:
  - "Hom_C(A, -)"
  - "よ(A) = Hom(A, -)"
explanation: "The Yoneda embedding よ: C → [C, Set] (or よ: C^op → [C, Set] in the covariant form) sends A to the hom-functor Hom(A, -). The Yoneda lemma guarantees that this embedding is fully faithful: morphisms A → B in C correspond exactly to natural transformations Hom(A,-) → Hom(B,-). Thus C embeds fully faithfully into its presheaf category, allowing objects to be studied via their interactions with all other objects."
