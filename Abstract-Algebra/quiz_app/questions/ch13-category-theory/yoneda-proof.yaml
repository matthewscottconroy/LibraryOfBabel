kind: proof
difficulty: advanced
text: "Prove the Yoneda lemma: for a locally small category C, a functor F: C → Set, and an object A ∈ C, there is a natural bijection Nat(Hom_C(A,-), F) ≅ F(A)."
proof_lines:
  - "Define a map Φ: Nat(Hom(A,-), F) → F(A) by Φ(η) = η_A(id_A), where η_A: Hom(A,A) → F(A) is the component at A."
  - "Define a map Ψ: F(A) → Nat(Hom(A,-), F) by: for x ∈ F(A) and f ∈ Hom(A,B), set (Ψ(x))_B(f) = ___."
  - "Naturality of Ψ(x): for any g: B → C, the naturality square requires (Ψ(x))_C(g ∘ f) = F(g)((Ψ(x))_B(f)), i.e. F(g∘f)(x) = F(g)(F(f)(x)), which holds by ___ of F."
  - "Φ ∘ Ψ = id: (Φ ∘ Ψ)(x) = Φ(Ψ(x)) = (Ψ(x))_A(id_A) = F(id_A)(x) = ___."
  - "Ψ ∘ Φ = id: given η ∈ Nat(Hom(A,-), F) and any f: A → B, naturality of η gives η_B(f) = η_B(f ∘ id_A) = F(f)(η_A(id_A)) = ___, so Ψ(Φ(η)) = η."
fills:
  - "F(f)(x)"
  - "functoriality"
  - "x"
  - "(Ψ(Φ(η)))_B(f)"
explanation: >
  The proof is a pure calculation: Ψ is the only possible inverse to Φ because
  naturality forces the value of any natural transformation at any morphism f: A → B
  to be determined by its value at id_A via η_B(f) = F(f)(η_A(id_A)). The two
  key steps are defining Ψ(x)_B(f) = F(f)(x) and verifying the round-trips using
  functoriality (F(id) = id) and naturality of η.
