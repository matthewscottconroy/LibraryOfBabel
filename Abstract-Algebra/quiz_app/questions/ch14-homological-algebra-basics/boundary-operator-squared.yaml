text: "In a chain complex C•, the defining condition on the boundary operators ∂ₙ: Cₙ → Cₙ₋₁ is that ∂ₙ ∘ ∂ₙ₊₁ = ___ for all n."
choices:
  - "0"
  - "the zero map"
explanation: >
  The condition ∂² = 0 (i.e., ∂ₙ ∘ ∂ₙ₊₁ = 0) ensures that im(∂ₙ₊₁) ⊆ ker(∂ₙ),
  which is what makes homology Hₙ = ker(∂ₙ)/im(∂ₙ₊₁) well-defined as a quotient
  of a submodule by a submodule. The homology then measures how far the inclusion
  im(∂ₙ₊₁) ⊆ ker(∂ₙ) is from being an equality.
