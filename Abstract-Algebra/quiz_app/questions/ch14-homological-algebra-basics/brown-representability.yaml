explanation: 'Brown representability: every cohomology theory {h^n} is represented
  by a sequence of spaces Eₙ (a spectrum E) with h^n(X) ≅ [X, Eₙ]. Ordinary cohomology:
  Eₙ = K(G,n). K-theory: E = BU × ℤ (Bott periodicity). The stable homotopy groups
  of spheres are the coefficients of the sphere spectrum.'
