text: "The ___ of a chain complex C• at position n, denoted Hₙ(C), is defined as ker(∂ₙ) / im(∂ₙ₊₁) and measures the failure of exactness at that position."
choices:
  - "homology"
  - "nth homology group"
explanation: >
  The homology Hₙ(C) = ker(∂ₙ) / im(∂ₙ₊₁) captures exactly the cycles (elements
  killed by ∂ₙ) modulo the boundaries (elements in the image of ∂ₙ₊₁). When
  Hₙ(C) = 0 for all n the complex is called acyclic or exact.
