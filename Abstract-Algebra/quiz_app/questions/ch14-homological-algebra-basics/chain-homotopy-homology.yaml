text: "If two chain maps f, g: C• → D• are chain homotopic, then they induce the same homomorphisms on homology."
answer: true
explanation: >
  A chain homotopy is a collection of maps hₙ: Cₙ → Dₙ₊₁ satisfying
  fₙ - gₙ = ∂ₙ₊₁∘hₙ + hₙ₋₁∘∂ₙ. For any cycle z ∈ ker(∂ₙ), one computes
  (f - g)(z) = ∂(h(z)) + h(∂(z)) = ∂(h(z)), which is a boundary. Thus f*(z)
  and g*(z) represent the same homology class, so f* = g* on Hₙ for all n.
