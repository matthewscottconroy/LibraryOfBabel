text: "Every exact sequence is a chain complex."
answer: true
explanation: >
  In an exact sequence, the image of each map equals the kernel of the next, which
  implies in particular that the composition of any two consecutive maps is zero.
  This is precisely the condition ∂² = 0 defining a chain complex, so every exact
  sequence is a chain complex. The converse fails: a chain complex need not be exact.
