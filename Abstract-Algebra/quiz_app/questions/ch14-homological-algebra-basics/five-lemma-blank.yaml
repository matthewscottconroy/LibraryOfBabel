text: "The ___ lemma states that in a commutative diagram of two exact rows connected by five vertical maps, if four of the five vertical maps are isomorphisms then the fifth is also an isomorphism."
choices:
  - "five"
  - "Five"
explanation: >
  The Five Lemma is proved by a diagram chase known as a "four lemma" applied twice:
  once to show injectivity of the middle map (using the left two outer isomorphisms)
  and once to show surjectivity (using the right two outer isomorphisms). It is a
  workhorse result for comparing homology theories.
