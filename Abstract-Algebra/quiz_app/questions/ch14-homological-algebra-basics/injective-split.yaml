text: "If A is an injective module then every short exact sequence 0 → A → B → C → 0 splits."
answer: true
explanation: >
  Injectivity of A means that every injective map into A (from any module) extends
  along any injective map of the domain. Concretely, the identity id_A: A → A extends
  along i: A → B to a retraction r: B → A with r∘i = id_A. This is a left splitting
  of the sequence, and by the Splitting Lemma B ≅ A ⊕ C. Injective modules are
  exactly the modules for which every short exact sequence starting with them splits.
