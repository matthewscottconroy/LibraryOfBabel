text: "The long exact sequence in homology is induced by a ___ exact sequence 0 → A• → B• → C• → 0 of chain complexes, via the connecting homomorphism ∂: Hₙ(C) → Hₙ₋₁(A)."
choices:
  - "short"
  - "short exact sequence"
explanation: >
  A short exact sequence of chain complexes is the minimal data needed: the Snake
  Lemma applied level-by-level produces the connecting homomorphism ∂, and splicing
  together the long exact sequences at each degree yields the infinite long exact
  sequence ··· → Hₙ(A) → Hₙ(B) → Hₙ(C) →^∂ Hₙ₋₁(A) → ···.
