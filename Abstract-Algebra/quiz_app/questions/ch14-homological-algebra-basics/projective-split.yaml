text: "If C is a projective module then every short exact sequence 0 → A → B → C → 0 splits."
answer: true
explanation: >
  Projectivity of C is equivalent to the lifting property: any surjection B → C
  admits a section s: C → B. A section of the surjection p: B → C is precisely a
  right splitting of the sequence, so by the Splitting Lemma B ≅ A ⊕ C. Thus
  projective modules are exactly those for which every short exact sequence ending
  in them splits.
