text: "A short exact sequence of chain complexes 0 → A• → B• → C• → 0 induces a long exact sequence in homology."
answer: true
explanation: >
  This is a foundational theorem of homological algebra. The connecting homomorphism
  ∂: Hₙ(C) → Hₙ₋₁(A) is constructed via the Snake Lemma, and one verifies that
  the resulting sequence ··· → Hₙ(A) → Hₙ(B) → Hₙ(C) →^∂ Hₙ₋₁(A) → ··· is exact
  at every term. This is the engine behind Mayer–Vietoris, the long exact sequence
  of a pair, and many other computations.
