explanation: 'Leray SS: E₂^{p,q} = H^p(Y; R^q f_* ℱ) ⇒ H^{p+q}(X;ℱ). The higher direct
  images R^q f_* ℱ are the sheaves on Y whose stalks are H^q(f⁻¹(y), ℱ). When Y =
  point, this reduces to the hypercohomology spectral sequence.'
