explanation: 'A splits iff (1) there is a right splitting s: C → B, (2) a left splitting
  r: B → A, (3) B ≅ A ⊕ C. C projective guarantees (1); A injective guarantees (2).
  But the SES splits regardless of the projectivity of A alone.'
