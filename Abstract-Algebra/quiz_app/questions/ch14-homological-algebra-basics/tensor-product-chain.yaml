explanation: 'The Künneth sequence splits as a sequence of abelian groups (non-naturally):
  Hₙ(C⊗D) ≅ (⊕_{i+j=n} Hᵢ⊗Hⱼ) ⊕ (⊕_{i+j=n-1} Tor(Hᵢ,Hⱼ)). The Tor term is the ''correction''
  for torsion, vanishing if all homology is free.'
