text: 'The Künneth theorem for chain complexes over a PID R states: if C_• is a complex
  of free R-modules, there is a short exact sequence 0 → ⊕_{i+j=n} Hᵢ(C) ⊗ Hⱼ(D) →
  Hₙ(C ⊗ D) → ⊕_{i+j=n-1} Tor(Hᵢ(C), Hⱼ(D)) → 0 which:'
