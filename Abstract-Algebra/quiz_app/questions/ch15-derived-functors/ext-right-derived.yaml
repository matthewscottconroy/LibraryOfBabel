text: "The functor Extⁿ(-, N) is the ___ derived functor of Hom(-, N), computed by applying Hom(-, N) to a projective resolution and taking cohomology."
choices:
  - "right"
  - "nth right"
explanation: >
  Hom(-, N) is a contravariant left-exact functor. Its right derived functors are
  Extⁿ(M, N) = Hⁿ(Hom(P•, N)) where P• → M is a projective resolution of M.
  The terminology "right derived" refers to the cohomological direction: Ext lives
  in positive degrees, computed by a cochain complex obtained by applying Hom to
  the resolution.
