text: "If pd(M) = n then Extᵏ(M, N) = 0 for all k > ___ and all modules N."
choices:
  - "n"
  - "pd(M)"
explanation: >
  A projective resolution of M of length n provides a projective resolution
  0 → Pₙ → ··· → P₀ → M → 0. Applying Hom(-, N) yields a cochain complex
  that is zero above degree n, so Hⁿ = 0 for k > n. Conversely, if Extⁿ⁺¹(M,-) = 0
  and Extⁿ(M,-) ≠ 0 then pd(M) = n, so the vanishing degree characterizes the
  projective dimension.
