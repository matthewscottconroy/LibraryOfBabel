text: "Ext¹_ℤ(ℤ/nℤ, ℤ) ≅ ℤ/nℤ."
answer: true
explanation: >
  Apply Hom(-, ℤ) to the projective resolution 0 → ℤ →^n ℤ → ℤ/nℤ → 0 to get
  the cochain complex 0 → Hom(ℤ,ℤ) →^{n·} Hom(ℤ,ℤ) → 0, i.e., 0 → ℤ →^{·n} ℤ → 0.
  Then Ext¹(ℤ/nℤ, ℤ) = coker(·n: ℤ → ℤ) = ℤ/nℤ. This computation also shows
  Ext⁰(ℤ/nℤ, ℤ) = Hom(ℤ/nℤ, ℤ) = 0 since ℤ is torsion-free.
