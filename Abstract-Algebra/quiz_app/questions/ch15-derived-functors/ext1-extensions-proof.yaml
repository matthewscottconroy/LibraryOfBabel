kind: proof
difficulty: advanced
text: >
  Theorem. Ext¹_R(M, N) classifies extensions of M by N, i.e., equivalence classes of
  short exact sequences 0 → N → E → M → 0, where two extensions are equivalent if
  there is a commutative diagram between them fixing N and M.
proof_lines:
  - "Let 0 → P₁ → P₀ → M → 0 be a projective presentation of M. Applying Hom(-, N) gives 0 → Hom(P₀,N) → Hom(P₁,N) → ... and Ext¹(M,N) = coker(Hom(P₀,N) → Hom(P₁,N)) = ___."
  - "Given an extension ε: 0 → N → E → M → 0, use projectivity of P₀ to lift id_M: M → M to s: P₀ → E, then restrict to get a map f: P₁ → N via f(x) = ___."
  - "One checks f ∈ Hom(P₁, N) and that changing the lift s changes f by an element of im(Hom(P₀,N) → Hom(P₁,N)), so the class [f] ∈ Ext¹(M,N) depends only on ε."
  - "The assignment ε ↦ [f] is a bijection: the extension corresponding to [f] is the pushout of 0 → P₁ → P₀ → M → 0 along f: P₁ → N."
  - "This bijection is natural and respects the abelian group structure via Baer sum, proving Ext¹(M,N) ≅ ___."
fills:
  - "ker(Hom(P₁,N) → Hom(P₂,N)) / im(Hom(P₀,N) → Hom(P₁,N))"
  - "s(i(x)) where i: P₁ → P₀ is the inclusion"
  - "the group of equivalence classes of extensions of M by N"
explanation: >
  The first blank identifies Ext¹(M,N) as the first cohomology of the Hom complex,
  making it concrete as a quotient. The second blank defines the crucial cocycle f
  measuring the failure of the lift s to commute with the inclusion — this is the
  connecting map that encodes the extension class. The third blank states the theorem's
  conclusion: Ext¹ is isomorphic to the Baer group of extension classes, showing
  the derived functor computation has direct geometric/algebraic meaning.
