difficulty: intermediate
text: "Every flat module is projective."
answer: false
explanation: >
  Flat does not imply projective in general. A standard counterexample: ℚ is a flat
  ℤ-module (as a localization of ℤ, tensoring with ℚ is exact) but ℚ is not projective
  over ℤ — a projective ℤ-module is a free abelian group, and ℚ is divisible, hence
  not free. Over local rings (Lazard's theorem) or for finitely generated modules over
  Noetherian local rings, flat does imply projective.
