kind: proof
difficulty: advanced
text: >
  Theorem. An R-module M is flat if and only if Tor₁^R(M, N) = 0 for all R-modules N.
proof_lines:
  - "(⇒) Assume M is flat, so − ⊗_R M is exact. For any N, take a projective resolution 0 → P₁ → P₀ → N → 0."
  - "Tensor with M: since M is flat the sequence 0 → P₁ ⊗ M → P₀ ⊗ M → N ⊗ M → 0 is ___."
  - "Thus Tor₁(M, N) = ker(P₁ ⊗ M → P₀ ⊗ M) = 0."
  - "(⇐) Assume Tor₁(M, N) = 0 for all N. Take any short exact sequence 0 → A → B → C → 0. The long exact sequence in Tor gives ··· → Tor₁(M,C) → A ⊗ M → B ⊗ M → C ⊗ M → 0."
  - "Since Tor₁(M, C) = ___ by hypothesis, the sequence 0 → A ⊗ M → B ⊗ M → C ⊗ M → 0 is exact."
  - "Since this holds for every short exact sequence, M is flat."
fills:
  - "exact (and hence remains short exact)"
  - "0"
explanation: >
  The forward direction uses flatness to preserve the short exact resolution of N after
  tensoring — the key blank is that the tensored sequence stays exact, from which
  Tor₁ vanishes by definition. The reverse direction uses the Tor long exact sequence:
  the vanishing hypothesis at the second blank kills the obstruction term, forcing
  − ⊗ M to remain exact on every short exact sequence, which is the definition of
  flatness.
