explanation: 'gl.dim R = sup{pd M : M is an R-module}. Ext^n_R(M,N) = 0 for all M,N
  iff n > gl.dim R. Semisimple rings have global dimension 0; hereditary rings (like
  PIDs) have global dimension ≤ 1.'
