text: 'The global dimension of a ring R is defined as:'
explanation: 'gl.dim(R) = sup{pd(M) : M is an R-module}. Fields have gl.dim = 0; ℤ has gl.dim = 1.'
tags:
- global-dimension
choices:
- the supremum of projective dimensions of all R-modules
- the Krull dimension of R
- the length of the longest chain of primes
- the rank of R as a free module
answer: 0
