difficulty: intermediate
text: "Tor^R_n(M, N) can be computed using either a projective or a ___ resolution of either argument M or N."
choices:
  - "flat"
  - "flat resolution"
explanation: >
  Because flat modules are Tor-acyclic (Tor vanishes on flat modules in positive
  degrees), any flat resolution F• → M gives Tor_n(M,N) = Hₙ(F• ⊗ N). This is
  more general than requiring a projective resolution and is often useful because
  flat resolutions can be easier to construct, e.g., for modules over commutative
  rings via localization arguments.
tags:
