text: "A spectral sequence E_r^{p,q} converges to H* if the filtration on H* satisfies E_∞^{p,q} ≅ ___ for each p, q."
choices:
  - "F^p H^{p+q} / F^{p+1} H^{p+q}"
  - "gr^p H^{p+q}"
explanation: >
  Convergence means the E∞ page computes the associated graded pieces of a filtration
  F^• on H*: specifically E_∞^{p,q} ≅ F^p H^{p+q} / F^{p+1} H^{p+q}. This does not
  generally recover H* itself (only its associated graded), so extension problems may
  remain. When the filtration splits (e.g., over a field) one gets a direct-sum
  decomposition H^n ≅ ⊕_{p+q=n} E_∞^{p,q}.
