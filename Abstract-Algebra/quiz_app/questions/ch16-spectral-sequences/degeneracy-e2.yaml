answer: 2
choices:
- All differentials d_r for r ≥ 2 are zero
- E_2 = E_∞
- Both A and B (they are equivalent)
- The spectral sequence collapses to a single row
difficulty: advanced
explanation: Degeneration at E_2 means all differentials d_2, d_3, … vanish, which
  is equivalent to saying E_2 = E_∞. This often follows from parity/degree arguments
  or when the E_2 page is concentrated in even total degree.
