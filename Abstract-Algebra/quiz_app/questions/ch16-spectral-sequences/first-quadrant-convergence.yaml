answer: true
difficulty: intermediate
explanation: In a first-quadrant spectral sequence, for fixed p+q only finitely many
  differentials can be non-zero (since eventually the source or target falls outside
  the first quadrant). Hence the sequence stabilizes and converges.
kind: tf
