choices:
- R^p G ∘ R^q F ⟹ R^{p+q}(G ∘ F)
- R^p F ∘ R^q G ⟹ R^{p+q}(F ∘ G)
- R^p G(R^q F(A)) ⟹ R^{p+q}(G ∘ F)(A)
- H^p(R^q F(A)) ⟹ R^{p+q}(G ∘ F)(A)
difficulty: advanced
explanation: The Grothendieck spectral sequence has E_2^{p,q} = R^p G(R^q F(A)) converging
  to R^{p+q}(G∘F)(A), when F sends injectives to G-acyclics. The Leray spectral sequence
  is a special case.
