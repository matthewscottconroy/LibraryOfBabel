text: "The Grothendieck spectral sequence computes the derived functors of a ___ of two functors, given that the first functor sends injective objects to acyclic objects for the second."
choices:
  - "composition"
  - "composite"
explanation: >
  If F: A → B and G: B → C are left-exact functors with F mapping injectives to
  G-acyclics, the Grothendieck spectral sequence gives E₂^{p,q} = (R^p G)(R^q F)(M)
  converging to R^{p+q}(G∘F)(M). This unifies many classical spectral sequences:
  the Leray spectral sequence (G = sections, F = pushforward), the Lyndon–Hochschild–Serre
  spectral sequence (group cohomology of an extension), and others.
