difficulty: advanced
text: "In the Hochschild–Serre spectral sequence for a group extension 1 → N → G → Q → 1 with coefficients in a G-module M, the E₂ page is E₂^{p,q} = H^p(Q; H^q(N; M)) converging to ___."
choices:
  - "H^{p+q}(G; M)"
  - "the group cohomology H^{p+q}(G; M)"
explanation: >
  The Hochschild–Serre spectral sequence is a special case of the Grothendieck spectral
  sequence applied to the composition of taking N-invariants then Q-invariants, which
  equals G-invariants by the normal subgroup assumption. The E₂ page records the
  cohomology of Q with coefficients in the cohomology of N, and the spectral sequence
  converges to H*(G; M). The edge homomorphisms give inflation H*(Q; M^N) → H*(G; M)
  and restriction H*(G; M) → H*(N; M)^Q.
