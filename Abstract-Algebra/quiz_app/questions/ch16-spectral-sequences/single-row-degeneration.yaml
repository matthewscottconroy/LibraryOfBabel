text: "If the E₂ page of a spectral sequence has only one nonzero row (or column), then the spectral sequence degenerates at E₂."
answer: true
explanation: >
  If E₂^{p,q} = 0 for all q ≠ q₀ (concentrated in a single row), then all differentials
  dᵣ for r ≥ 2 must be zero: since dᵣ has bidegree (r, -r+1), the target E_r^{p+r,q-r+1}
  lies in a different row and is therefore zero. Thus E₂ = E₃ = ··· = E∞, and the
  spectral sequence degenerates. The same reasoning applies when only a single column
  is nonzero.
