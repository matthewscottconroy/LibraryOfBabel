explanation: 'R(G) = K_0(Rep_ℂ(G)) is a commutative ring: commutativity follows from
  V ⊗ W ≅ W ⊗ V (not as isomorphism of representations but as G-modules they are isomorphic).
  It has a ℤ-basis of irreducibles.'
