text: "Two representations of a finite group over ℂ are isomorphic if and only if they have the same ___."
choices:
  - "character"
  - "trace function"
explanation: "The character χ_V(g) = Tr(ρ(g)) is a complete invariant for representations over ℂ: two representations are isomorphic if and only if their characters agree on every group element. This follows from the fact that the character determines the multiplicities of irreducible summands via the inner product formula."
