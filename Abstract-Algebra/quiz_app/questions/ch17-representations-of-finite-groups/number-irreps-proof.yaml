kind: proof
difficulty: advanced
text: "Theorem: The number of irreducible representations of a finite group G over ℂ equals the number of conjugacy classes of G."
proof_lines:
  - "The space of class functions on G has dimension equal to the number of conjugacy classes, since class functions are constant on each class."
  - "Characters of irreducible representations are class functions. By the first orthogonality relation, distinct irreducible characters χᵢ satisfy ⟨χᵢ, χⱼ⟩ = ___, so they are linearly independent."
  - "The group algebra ℂ[G] decomposes as ℂ[G] ≅ ⊕ᵢ End(Vᵢ) ≅ ⊕ᵢ M_{nᵢ}(ℂ) by the Artin-Wedderburn theorem, where the Vᵢ are the distinct irreducible representations."
  - "The center Z(ℂ[G]) has dimension equal to the number of conjugacy classes, while the center of ⊕ᵢ M_{nᵢ}(ℂ) has dimension equal to ___."
  - "Therefore the number of irreducible representations equals dim Z(ℂ[G]) = the number of conjugacy classes, and the irreducible characters form a ___ for the space of class functions."
fills:
  - "δᵢⱼ"
  - "the number of irreducible representations"
  - "basis"
explanation: >
  The first blank records orthonormality of irreducible characters, which forces linear independence.
  The second blank is the key dimension count: the center of a direct sum of matrix algebras has
  exactly one central element per summand (the identity of each block), so its dimension equals
  the number of summands, i.e., the number of irreducible representations. Comparing this with
  dim Z(ℂ[G]) = number of conjugacy classes gives the equality. The final blank states that the
  irreducible characters are not merely linearly independent but span all class functions, forming
  a complete orthonormal basis.
