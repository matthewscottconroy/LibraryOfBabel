text: "The ___ representation of G is the action of G on the group algebra k[G] by left multiplication."
choices:
  - "regular"
  - "left regular"
explanation: "In the regular representation, G acts on the vector space k[G] with basis {e_g : g ∈ G} by h·e_g = e_{hg}. Every irreducible representation of G appears as a subrepresentation of the regular representation, with multiplicity equal to its dimension (over ℂ)."
