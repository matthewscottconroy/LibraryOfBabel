difficulty: beginner
text: "A representation of a group G over a field k is a group homomorphism ρ: G → ___ for some k-vector space V."
choices:
  - "GL(V)"
  - "End(V)"
explanation: "A representation assigns to each group element g an invertible linear transformation ρ(g) on V, so the codomain is the general linear group GL(V) of invertible k-linear automorphisms of V. End(V) is not quite right because invertibility is required."
tags:
