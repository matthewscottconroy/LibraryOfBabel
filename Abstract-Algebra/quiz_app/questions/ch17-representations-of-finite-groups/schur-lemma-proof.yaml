kind: proof
difficulty: advanced
text: "Schur's Lemma: Let V and W be irreducible representations of G over an algebraically closed field k. Any G-equivariant map φ: V → W is either 0 or an isomorphism. Moreover, any G-equivariant endomorphism φ: V → V is a scalar multiple of the identity."
proof_lines:
  - "Let φ: V → W be G-equivariant, i.e., φ(g·v) = g·φ(v) for all g ∈ G, v ∈ V."
  - "ker(φ) is a G-invariant subspace of V. Since V is irreducible, ker(φ) = 0 or ___."
  - "im(φ) is a G-invariant subspace of W. Since W is irreducible, im(φ) = 0 or ___."
  - "If ker(φ) = 0 and im(φ) = W, then φ is an isomorphism. Otherwise φ = 0. This proves the first part."
  - "For the second part, let φ: V → V be a G-endomorphism. Since k is algebraically closed, φ has an eigenvalue λ ∈ k. Then φ − λ·id is a G-equivariant endomorphism with nontrivial kernel, so φ − λ·id = ___, i.e., φ = ___."
fills:
  - "V"
  - "W"
  - "0"
  - "λ·id"
explanation: >
  The first blank uses irreducibility of V: a G-invariant subspace of an irreducible representation
  is either the whole space or zero. The second blank applies the same reasoning to W via the image.
  Together these give the dichotomy: φ is 0 or an isomorphism. For the scalar conclusion, the
  algebraically closed hypothesis guarantees the existence of an eigenvalue λ; the map φ − λ·id
  is again G-equivariant and has a nonzero kernel, so by the first part it must be identically zero.
