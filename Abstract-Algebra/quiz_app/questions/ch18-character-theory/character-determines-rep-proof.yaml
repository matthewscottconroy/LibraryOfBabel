kind: proof
difficulty: advanced
text: "Theorem: Over ℂ, a representation of a finite group G is determined up to isomorphism by its character."
proof_lines:
  - "Every complex representation V of G decomposes as V ≅ ⊕ᵢ Vᵢ^{mᵢ} (direct sum of irreducibles with multiplicities mᵢ), by Maschke's theorem."
  - "Taking characters: χ_V = Σᵢ mᵢ χᵢ. Using the inner product, mᵢ = ⟨χ_V, χᵢ⟩ = (1/|G|) Σ_{g∈G} χ_V(g) ___."
  - "Since the mᵢ are determined by χ_V via the inner products ⟨χ_V, χᵢ⟩, the isomorphism type of V is ___ by χ_V."
  - "In particular, if χ_V = χ_W then ⟨χ_V, χᵢ⟩ = ⟨χ_W, χᵢ⟩ for every irreducible χᵢ, so V and W have the same multiplicities and hence V ≅ ___."
fills:
  - "χ̄ᵢ(g)"
  - "uniquely determined"
  - "W"
explanation: >
  The first blank is the explicit inner product formula: the multiplicity of the i-th irreducible
  in V equals ⟨χ_V, χᵢ⟩ = (1/|G|) Σ_g χ_V(g) χ̄ᵢ(g), using the first orthogonality relation.
  The second blank states the conceptual conclusion: the character encodes all multiplicities,
  hence the entire isomorphism type. The final blank completes the logical chain: equal characters
  imply equal multiplicities imply isomorphic representations.
