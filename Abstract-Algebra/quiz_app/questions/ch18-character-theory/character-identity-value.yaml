text: "For any representation ρ: G → GL(V), the value of the character at the identity element e ∈ G is χ(e) = ___."
choices:
  - "dim V"
  - "the dimension of V"
explanation: "Since ρ(e) = id_V, we have χ(e) = Tr(id_V) = dim V. This means the character value at the identity records the degree (dimension) of the representation. In character tables, the first column corresponds to the identity element and lists the dimensions of all irreducible representations."
