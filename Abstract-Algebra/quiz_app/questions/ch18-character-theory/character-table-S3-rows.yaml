text: "The character table of S₃ has ___ rows and ___ columns."
choices:
  - "3 rows and 3 columns"
  - "3"
explanation: "S₃ has exactly 3 conjugacy classes: {e}, {(12),(13),(23)}, and {(123),(132)}. The number of irreducible representations equals the number of conjugacy classes, so the character table is a 3×3 matrix. The three irreducible representations are the trivial (dim 1), the sign (dim 1), and the standard (dim 2), with 1² + 1² + 2² = 6 = |S₃|."
