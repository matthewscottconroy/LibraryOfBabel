text: "The character of a representation ρ: G → GL(V) is the function χ: G → ℂ defined by χ(g) = ___."
choices:
  - "Tr(ρ(g))"
  - "trace of ρ(g)"
explanation: "The character χ_V(g) = Tr(ρ(g)) is the trace of the linear map ρ(g): V → V. Because trace is invariant under conjugation, χ(hgh⁻¹) = Tr(ρ(hgh⁻¹)) = Tr(ρ(h)ρ(g)ρ(h)⁻¹) = Tr(ρ(g)) = χ(g), confirming that characters are class functions."
