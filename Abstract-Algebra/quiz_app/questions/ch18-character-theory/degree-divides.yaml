answer: true
difficulty: intermediate
explanation: By column orthogonality and integrality of characters, each irreducible
  character degree dᵢ divides |G|. In fact dᵢ divides |G|/|Z(G)| for non-linear irreps.
  This uses the fact that |G|/dᵢ is an algebraic integer.
kind: tf
