- induced-representations
choices:
- ⟨Ind_H^G V, W⟩_G = ⟨V, Res_H^G W⟩_H
- Ind and Res are inverse functors
- every G-rep is induced from H
- the induced rep has dimension |G:H|·dim(V) only if G/H is abelian
