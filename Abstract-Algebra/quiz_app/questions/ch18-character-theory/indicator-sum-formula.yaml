explanation: '∑_{χ irred} ν(χ)dim(χ)... actually: ∑_χ ν(χ) = |{g ∈ G : g² = e}|. This
  follows from summing the formula ν(χ) = (1/|G|)∑_g χ(g²) and using completeness
  of characters.'
