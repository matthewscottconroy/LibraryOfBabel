difficulty: advanced
text: "Cartan's Criterion: A Lie algebra g over a field of characteristic 0 is semisimple if and only if its Killing form B(X,Y) = Tr(ad X ∘ ad Y) is nondegenerate."
proof_lines:
  - "Define the radical ideal rad(g) as the largest solvable ideal of g. Then g is semisimple by definition iff rad(g) = ___."
  - "(⇒) Suppose g is semisimple. If B(X,Y) = 0 for all Y ∈ g, let I = {X ∈ g : B(X,Y) = 0 ∀Y}. One shows I is an ideal. By Cartan's solvability criterion, a Lie algebra h is solvable iff Tr(ad X ∘ ad Y) = 0 for all X ∈ h and Y ∈ [h,h]. Applying this to I shows I is ___, so I ⊆ rad(g) = 0."
  - "(⇐) Suppose B is nondegenerate. If a ⊆ g is an abelian ideal, then for X ∈ a and any Y, Z ∈ g, the composition ad X ∘ ad Y maps g → a → 0 (since a is abelian and ideal), so Tr(ad X ∘ ad Y) = ___."
  - "Hence every X ∈ a satisfies B(X, −) = 0. Nondegeneracy of B forces a = 0. Since every solvable ideal contains an abelian ideal, rad(g) = ___, so g is semisimple."
fills:
  - "0"
  - "solvable"
  - "0"
  - "0"
explanation: >
  The first blank is the definition of semisimplicity: trivial radical. The second blank applies
  Cartan's solvability criterion (a companion theorem): the ideal I of elements orthogonal to all
  of g is solvable because all traces vanish, placing I in the radical, which is 0 by assumption.
  The third blank uses the ideal property: for X in an abelian ideal a, ad(X) maps g into a, and
  ad(Y) then maps a back into a; but since a is abelian, [X, ad(Y)(something)] = 0, so the
  composition has zero trace. The fourth blank collects the consequences to conclude rad(g) = 0.
