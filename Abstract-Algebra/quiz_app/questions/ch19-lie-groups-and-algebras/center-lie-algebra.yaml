text: "The center of a Lie algebra g is the set Z(g) = {X ∈ g : [X,Y] = ___ for all Y ∈ g}."
choices:
  - "0"
explanation: "The center Z(g) consists of all elements X that bracket to zero with everything in g. It is an abelian ideal of g. For a semisimple Lie algebra, Z(g) = 0 (since any central element would generate an abelian ideal, contradicting semisimplicity). The center corresponds under the Lie correspondence to the center of the connected simply-connected Lie group G."
