choices:
- Lie(G̃) ≅ Lie(G) and G̃ is simply connected
- G̃ ≅ G always
- G̃ is compact iff G is compact
- π₁(G̃) ≅ π₁(G)
difficulty: advanced
explanation: The universal cover G̃ → G is a covering group with the same Lie algebra
  but trivial fundamental group. The kernel of G̃ → G is π₁(G), a discrete central
  subgroup of G̃ (by covering space theory).
