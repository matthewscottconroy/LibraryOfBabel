explanation: An ideal 𝔥 ◁ 𝔤 satisfies [X,H] ∈ 𝔥 for all X ∈ 𝔤, H ∈ 𝔥. This is stronger
  than being a subalgebra (which requires only [𝔥,𝔥] ⊆ 𝔥). Kernels of Lie algebra
  homomorphisms are ideals.
