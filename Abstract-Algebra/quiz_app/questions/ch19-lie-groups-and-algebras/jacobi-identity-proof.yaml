difficulty: advanced
text: "Theorem: The adjoint representation bracket [X,Y] = ad(X)(Y) satisfies the Jacobi identity: [[X,Y],Z] + [[Y,Z],X] + [[Z,X],Y] = 0 for all X, Y, Z ∈ g."
proof_lines:
  - "Recall that for a Lie group G with Lie algebra g = T_e G, the bracket is defined via the adjoint action: [X,Y] = d/dt|_{t=0} Ad(exp(tX)) Y, which encodes the failure of exp(tX) and exp(sY) to commute."
  - "Equivalently, identify g with left-invariant vector fields on G. The Lie bracket is then the commutator of vector fields: [X,Y] = XY − YX as differential operators. The Jacobi identity for this bracket reads [[X,Y],Z] = [X,[Y,Z]] − ___."
  - "Expanding using the commutator: [[X,Y],Z] + [[Y,Z],X] + [[Z,X],Y] = (XY−YX)Z − Z(XY−YX) + (YZ−ZY)X − X(YZ−ZY) + (ZX−XZ)Y − Y(ZX−XZ). Each monomial of degree 3 appears exactly twice with ___."
  - "Therefore the total sum is ___, proving the Jacobi identity."
fills:
  - "[Y,X·]"
  - "opposite signs"
  - "0"
explanation: >
  The second blank uses the anti-symmetry of the commutator: [X,Y] = XY − YX so [Y,Z·] would
  expand with the appropriate sign flip. The key insight in the third blank is the cancellation:
  when all six cyclic permutations of the degree-3 monomials XYZ, XZY, YXZ, YZX, ZXY, ZYX are
  collected, each appears with coefficient +1 and −1, giving perfect cancellation. The final blank
  records the conclusion: the sum vanishes identically as a consequence of the antisymmetry of
  the commutator bracket.
