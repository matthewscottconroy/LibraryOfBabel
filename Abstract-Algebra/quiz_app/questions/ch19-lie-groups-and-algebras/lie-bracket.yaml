explanation: 'A Lie algebra has a bilinear bracket satisfying: [X,X] = 0 (⇒ anti-symmetry),
  and the Jacobi identity. The Lie bracket is generally not associative. For matrix
  Lie algebras, [X,Y] = XY − YX.'
