text: "The ___ of a Lie algebra g is the largest solvable ideal of g, denoted rad(g). When rad(g) = 0, the algebra is semisimple."
choices:
  - "radical"
  - "solvable radical"
explanation: "The radical rad(g) exists because the sum of two solvable ideals is solvable (using the derived series), so there is a unique largest one. The Levi decomposition theorem states that every finite-dimensional Lie algebra over a field of characteristic 0 splits as g = rad(g) ⋊ s for a semisimple subalgebra s (the Levi factor). This generalizes the structure theory from semisimple to arbitrary Lie algebras."
