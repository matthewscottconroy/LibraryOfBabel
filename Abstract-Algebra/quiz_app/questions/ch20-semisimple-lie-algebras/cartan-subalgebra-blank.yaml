text: "A Cartan subalgebra of a Lie algebra g is a subalgebra h that is ___ and equal to its own normalizer in g."
choices:
  - "nilpotent"
  - "abelian and self-normalizing"
explanation: >
  A Cartan subalgebra h ⊆ g is defined as a nilpotent subalgebra that is self-normalizing: N_g(h) = h. For semisimple g over ℂ, every Cartan subalgebra is maximal abelian and consists entirely of ad-semisimple elements, but the correct general definition requires nilpotency (not merely abelian).
