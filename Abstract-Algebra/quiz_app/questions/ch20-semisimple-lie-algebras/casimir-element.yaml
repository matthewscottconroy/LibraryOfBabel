explanation: By Schur's lemma C acts as a scalar on V(λ). The eigenvalue is ⟨λ, λ+2ρ⟩
  = ⟨λ+ρ,λ+ρ⟩ − ⟨ρ,ρ⟩. This is the Freudenthal–de Vries formula.
