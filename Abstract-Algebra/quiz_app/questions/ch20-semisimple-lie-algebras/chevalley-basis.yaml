explanation: A Chevalley basis has all structure constants in ℤ, enabling a ℤ-form
  of 𝔤. Reducing mod p gives the corresponding Lie algebra over 𝔽_p, fundamental in
  the classification and representation theory of reductive groups over finite fields.
