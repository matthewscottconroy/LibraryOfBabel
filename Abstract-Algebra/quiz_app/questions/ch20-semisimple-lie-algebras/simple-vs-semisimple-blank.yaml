text: "A Lie algebra g is simple if it is non-abelian and has no proper nonzero ideals. It is semisimple if its ___ is zero."
choices:
  - "radical (maximal solvable ideal)"
  - "center"
explanation: >
  The radical rad(g) is the unique largest solvable ideal of g. A Lie algebra is semisimple if and only if rad(g) = 0. Equivalently (by the structure theorem), g is semisimple iff it is a direct sum of simple Lie algebras. Note: every simple Lie algebra is semisimple, but the converse fails (e.g., sl(2) ⊕ sl(2) is semisimple but not simple).
