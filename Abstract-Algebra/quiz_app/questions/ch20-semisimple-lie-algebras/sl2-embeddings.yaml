explanation: For each root α, {E_α, F_α = E_{-α}, H_α} forms an sl₂-triple satisfying
  [H_α, E_α] = 2E_α, [H_α, F_α] = −2F_α, [E_α, F_α] = H_α. These sl₂-embeddings are
  crucial for the structure theory.
