text: "The weight lattice P is the dual lattice to the coroot lattice Q∨. Equivalently, P = { λ ∈ h* : ⟨λ, α∨⟩ ∈ ℤ for all roots α }, and one always has Q ⊆ P with the quotient P/Q isomorphic to ___."
choices:
  - "the center Z(G) of the simply-connected Lie group G with Lie algebra g"
  - "the Weyl group"
explanation: >
  For a semisimple Lie algebra g with simply-connected group G, the quotient P/Q of weight lattice by root lattice is isomorphic to the fundamental group π₁ of the adjoint group, equivalently the center Z(G) of the simply-connected cover. For example, for sl(n, ℂ) one has P/Q ≅ ℤ/nℤ ≅ Z(SU(n)).
