text: "The Weyl group of a semisimple Lie algebra g is always a subgroup of the automorphism group of the root system Φ."
answer: true
explanation: >
  The Weyl group W is generated by reflections s_α for simple roots α, and each reflection is an isometry of the root system (it permutes the roots). Thus W ⊆ Aut(Φ). In general W is a proper subgroup: for example, for A₁ × A₁ the full automorphism group includes the swap of the two factors, which is not in the Weyl group. The Weyl group is in fact the subgroup of Aut(Φ) generated by reflections.
