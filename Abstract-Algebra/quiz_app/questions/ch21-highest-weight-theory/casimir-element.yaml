explanation: By Schur's lemma, the Casimir (and all central elements of U(𝔤)) acts
  by a scalar on irreducibles. The quadratic Casimir acts by ⟨λ+ρ,λ+ρ⟩ − ⟨ρ,ρ⟩ = ⟨λ,λ+2ρ⟩.
  This distinguishes representations with different highest weights.
