text: "Every finite-dimensional representation of a semisimple Lie algebra over ℂ decomposes as a direct sum of irreducible subrepresentations."
answer: true
explanation: >
  This is Weyl's complete reducibility theorem (also called Weyl's theorem on complete reducibility). It follows from the existence of a Casimir element that acts by a nonzero scalar on each nontrivial irreducible, allowing extensions to split. The theorem fails for non-semisimple Lie algebras: for example, the 2-dimensional solvable Lie algebra has indecomposable but reducible representations.
