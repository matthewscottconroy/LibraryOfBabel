kind: proof
difficulty: advanced
text: >
  Existence and Uniqueness of Highest Weight Modules: For each dominant integral weight λ, there exists a unique (up to isomorphism) finite-dimensional irreducible g-module L(λ) with highest weight λ.
proof_lines:
  - "Existence: Construct the Verma module M(λ) = U(g) ⊗_{U(b)} ℂ_λ, where b = h ⊕ n⁺ is the Borel subalgebra and ℂ_λ is the 1-dimensional b-module on which h acts by λ and n⁺ acts by ___."
  - "M(λ) has a unique maximal proper submodule N(λ) (since λ is dominant integral, this is the submodule generated by the vectors e_α^{⟨λ,α∨⟩+1}·v_λ for each simple root α)."
  - "Set L(λ) = M(λ)/N(λ). This is a nonzero g-module with highest weight vector v_λ + N(λ)."
  - "Finite-dimensionality follows from the dominance condition: λ satisfies ⟨λ, α∨⟩ ∈ ___ for all simple roots α, which forces all weight spaces to be finite-dimensional and the module to be bounded below."
  - "Uniqueness: any two irreducible modules with highest weight λ must be isomorphic because both are quotients of M(λ) by a maximal submodule, and maximal submodules are ___."
fills:
  - "0"
  - "ℤ≥0"
  - "unique"
explanation: >
  The three blanks capture the three key points: (1) the positive root spaces kill the highest weight vector, (2) dominant integrality is precisely the condition ⟨λ,α∨⟩ ∈ ℤ≥0, ensuring finite-dimensionality, and (3) the maximal submodule of a Verma module is unique, giving uniqueness of L(λ). The proof strategy — construct via Verma, then quotient — is the standard route in Lie representation theory.
