text: "Every finite-dimensional irreducible representation of a semisimple Lie algebra over ℂ is a highest weight module."
answer: true
explanation: >
  Any finite-dimensional g-module V decomposes into weight spaces V = ⊕ Vμ. Among all weights of V, choose a maximal one λ (with respect to the partial order μ ≤ λ iff λ−μ is a sum of positive roots). The weight space V_λ is annihilated by all positive root spaces n⁺, so any nonzero v ∈ V_λ is a highest weight vector. If V is irreducible, the cyclic submodule U(g)·v = V, making V a highest weight module with weight λ.
