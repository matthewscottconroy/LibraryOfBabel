text: "For a weight λ and simple root α in a finite-dimensional irreducible representation L(λ), the α-string through a weight μ is the set of weights μ − rα, ..., μ, ..., μ + qα, and one has r − q = ___."
choices:
  - "⟨μ, α∨⟩"
  - "⟨λ, α∨⟩"
explanation: >
  For any weight μ of a finite-dimensional representation and simple root α, the α-string through μ consists of weights μ + kα for k in some range [−r, q], and the key identity is r − q = ⟨μ, α∨⟩. This integrality and string structure is a consequence of the sl₂-representation theory applied to the sl₂-triple {eα, fα, hα}. It means the string is symmetric about μ − (⟨μ,α∨⟩/2)α.
