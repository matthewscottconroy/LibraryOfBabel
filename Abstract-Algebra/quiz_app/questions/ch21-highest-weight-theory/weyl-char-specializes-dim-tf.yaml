text: "The Weyl character formula specializes to the Weyl dimension formula when all formal exponentials e^μ are set equal to 1."
answer: true
explanation: >
  The Weyl character formula states ch L(λ) = Σ_{w∈W} (-1)^{l(w)} e^{w(λ+ρ)} / Σ_{w∈W} (-1)^{l(w)} e^{w(ρ)}. Setting all e^μ = 1 makes the numerator and denominator both equal to 0/0 in naive substitution, but applying L'Hôpital's rule (or equivalently, taking the limit as formal variables → 1) yields the Weyl dimension formula dim L(λ) = ∏_{α>0} ⟨λ+ρ, α∨⟩/⟨ρ, α∨⟩.
