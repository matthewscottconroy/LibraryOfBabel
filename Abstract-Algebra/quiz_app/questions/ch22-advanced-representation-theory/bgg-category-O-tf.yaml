text: "In BGG category O, every object has finite length (a composition series with finitely many simple factors)."
answer: true
explanation: >
  Every module M in category O has finite length. This is proved by showing that M has a filtration by Verma modules (or generalized Verma modules), and each Verma module itself has finite length (its composition factors are the L(y·λ) for y ≤ w in the Bruhat order, by the KL theorem). The key finiteness comes from the local finiteness of n⁺ and the finite-dimensionality of weight spaces. Finite length is essential for the Jordan–Hölder multiplicities to make sense.
