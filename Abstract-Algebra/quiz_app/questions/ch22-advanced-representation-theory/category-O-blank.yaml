text: "Category O for a semisimple Lie algebra g is the full subcategory of g-modules consisting of modules that are: (1) finitely generated over U(g); (2) semisimple as h-modules (weight spaces are finite-dimensional); and (3) locally ___ for the action of n⁺."
choices:
  - "finite (each vector is annihilated by a power of n⁺)"
  - "irreducible"
explanation: >
  The BGG category O is defined by three conditions: finite generation, h-semisimplicity (direct sum of finite-dimensional weight spaces), and local finiteness of n⁺ (for each v ∈ M, the space U(n⁺)·v is finite-dimensional). This last condition is equivalent to saying U(n⁺)·v is finite-dimensional for all v. Verma modules and their quotients (including L(λ)) all belong to O, as do all finite-dimensional g-modules.
