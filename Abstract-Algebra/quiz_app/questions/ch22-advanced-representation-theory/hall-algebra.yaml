explanation: In the Hall algebra, [M]·[N] = ∑_L P^L_{MN}[L] where P^L_{MN} counts
  submodules of L isomorphic to N with quotient ≅ M (Hall numbers). The Hall algebra
  of Rep(Q) over 𝔽_q realizes the positive part of the quantum group U_q(g).
