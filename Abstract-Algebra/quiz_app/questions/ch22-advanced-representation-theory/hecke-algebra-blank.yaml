text: "The Hecke algebra H_q(W) associated to a Weyl group W is a deformation of the group algebra ℂ[W] with generators Tₛ for simple reflections s, satisfying the braid relations and the quadratic relation (Tₛ − q)(Tₛ + ___) = 0."
choices:
  - "1"
  - "q"
explanation: >
  The Hecke algebra H_q(W) has generators {Tₛ} subject to: (1) braid relations Tₛ Tₜ Tₛ ... = Tₜ Tₛ Tₜ ... (alternating, length m_{st}); (2) quadratic relation (Tₛ − q)(Tₛ + 1) = 0, i.e., Tₛ² = (q−1)Tₛ + q. At q = 1, Tₛ satisfies Tₛ² = 1, recovering the group algebra of W. The Kazhdan–Lusztig basis {C_w} of H_q(W) is defined by symmetry under a bar involution and is the bridge to KL polynomials.
