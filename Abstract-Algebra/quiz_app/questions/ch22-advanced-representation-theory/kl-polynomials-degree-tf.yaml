text: "The Kazhdan–Lusztig polynomials P_{y,w}(q) satisfy deg P_{y,w} < (l(w) − l(y) − 1)/2 whenever y < w in the Bruhat order and P_{y,w} ≠ 1."
answer: true
explanation: >
  One of the original conjectures of Kazhdan and Lusztig, now proven, is that P_{y,w}(q) has degree strictly less than (l(w)−l(y)−1)/2 when y < w. This is a strong constraint — it says the polynomial is "as small as possible" given its leading term. When y = w, P_{y,w} = 1 (degree 0). The degree bound is part of what makes KL polynomials well-defined inductively and is related to the Hard Lefschetz theorem in intersection cohomology.
