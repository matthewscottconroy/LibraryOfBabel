text: "The quantum group U_q(g) is a deformation of the universal enveloping algebra U(g) parametrized by q ∈ ℂ*. At q = 1, U_q(g) recovers U(g), while at q = ___, the representation theory has special properties related to modular representations."
choices:
  - "a root of unity"
  - "0"
explanation: >
  When q is a primitive ℓ-th root of unity, the quantum group U_q(g) has a large center (including elements E_α^ℓ, F_α^ℓ, K_α^ℓ) and its representation theory is analogous to the modular representation theory of algebraic groups in characteristic ℓ. This is the key case for applications to the Jones polynomial, topological quantum field theory (Reshetikhin–Turaev invariants), and Kazhdan–Lusztig's proof of the affine KL conjecture via quantum groups at roots of unity.
