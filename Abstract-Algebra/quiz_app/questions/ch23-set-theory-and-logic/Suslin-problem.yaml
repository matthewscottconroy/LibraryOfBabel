explanation: 'Suslin''s problem is independent of ZFC: it is consistent with ZFC (using
  a Suslin line constructed with ♦) and consistent that no Suslin line exists (using
  Martin''s Axiom + ¬CH). A Suslin line would be a counterexample to the problem.'
