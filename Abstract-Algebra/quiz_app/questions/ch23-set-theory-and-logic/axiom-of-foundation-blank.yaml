text: "The Axiom of Foundation (Regularity) in ZFC states that every nonempty set A contains an element x such that x and A are ___."
choices:
  - "disjoint (x ∩ A = ∅)"
  - "comparable under ∈"
explanation: >
  The Axiom of Foundation states: ∀A (A ≠ ∅ → ∃x ∈ A (x ∩ A = ∅)). It rules out sets that are members of themselves (x ∈ x), infinite descending ∈-chains (... ∈ x₂ ∈ x₁ ∈ x₀), and other "ill-founded" sets. Foundation ensures the cumulative hierarchy V = ∪_α V_α exhausts all sets. It is independent of the other ZFC axioms and is often omitted in non-well-founded set theories.
