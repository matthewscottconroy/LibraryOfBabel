kind: proof
difficulty: intermediate
text: >
  Cantor's Theorem: For any set S, |S| < |P(S)|. That is, there is no surjection from S onto its power set P(S).
proof_lines:
  - "There is always an injection S → P(S) given by s ↦ {s}, so |S| ≤ |P(S)|. It remains to show there is no surjection S → P(S)."
  - "Suppose for contradiction that f: S → P(S) is a surjection. Define the diagonal set D = { x ∈ S : x ∉ ___ }."
  - "Since f is a surjection, there exists d ∈ S with f(d) = D."
  - "Ask whether d ∈ D: if d ∈ D then by definition d ∉ f(d) = D, a contradiction; if d ∉ D then d ∉ f(d) so d ∈ ___, a contradiction."
  - "In either case we reach a contradiction, so no surjection S → P(S) exists."
fills:
  - "f(x)"
  - "D"
explanation: >
  The diagonal argument defines D using the negation of membership in f(x). The element d is the "diagonal element" whose membership in D is undecidable under the assumption that f is surjective. This argument is Cantor's diagonal method, the same idea behind Gödel's incompleteness theorem, the halting problem, and Russell's paradox. The two blanks mark the two critical uses of the definition: D is defined via f(x), and the contradiction in the second case lands d back in D.
