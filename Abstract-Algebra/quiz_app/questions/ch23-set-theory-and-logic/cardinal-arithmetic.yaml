explanation: For infinite cardinals, κ + κ = κ (cardinal arithmetic is not like ordinary
  arithmetic). More generally, for infinite κ ≥ λ, κ + λ = κ·λ = max(κ,λ) = κ. This
  follows from the well-ordering of cardinals.
