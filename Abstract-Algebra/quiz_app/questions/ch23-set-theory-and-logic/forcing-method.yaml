explanation: 'Cohen''s forcing: starting from a model M of ZFC, one adjoins a generic
  filter G ⊂ P for a poset P (e.g., finite partial functions ω × ω_2 → 2) to form
  M[G]. With P = Fn(ω×ω_2, 2), M[G] satisfies 2^{ℵ₀} ≥ ℵ_2, refuting CH.'
