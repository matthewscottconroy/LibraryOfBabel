text: "Gödel's Second Incompleteness Theorem states that if T is a consistent, recursively axiomatizable theory extending PA (or ZFC), then T cannot prove ___."
choices:
  - "its own consistency Con(T)"
  - "the law of excluded middle"
explanation: >
  The Second Incompleteness Theorem: any sufficiently strong consistent formal system T cannot prove Con(T) (the formalized statement "T is consistent") within T itself. This rules out Hilbert's program of proving the consistency of mathematics from within mathematics. The proof is via arithmetization: one encodes "T proves φ" as an arithmetic statement, and then the proof of the first incompleteness theorem can be formalized to give Con(T) → ¬Provable_T(⊥), making Con(T) an unprovable statement.
