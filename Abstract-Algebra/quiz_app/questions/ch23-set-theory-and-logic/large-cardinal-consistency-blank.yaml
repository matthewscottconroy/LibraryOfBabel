text: "A measurable cardinal is a cardinal κ that admits a κ-complete non-principal ultrafilter on κ. The existence of a measurable cardinal ___ the consistency of ZFC."
choices:
  - "implies (strictly increases the consistency strength beyond)"
  - "is equivalent to"
explanation: >
  If a measurable cardinal κ exists, then V_κ is a model of ZFC (since κ is inaccessible), so Con(ZFC) holds. Thus the existence of a measurable cardinal implies Con(ZFC), meaning it has strictly greater consistency strength than ZFC alone. More precisely: ZFC + "there exists a measurable cardinal" ⊢ Con(ZFC), but ZFC alone cannot prove this (by Gödel's second incompleteness theorem). This is the beginning of the large cardinal hierarchy.
