answer: 0
choices:
- 1 + ω = ω ≠ ω + 1
- ω + 1 = 1 + ω
- ω · 2 = 2 · ω
- ωω = ω + ω
difficulty: intermediate
explanation: 1 + ω = ω (a finite initial segment before ω is still ω-type) but ω +
  1 > ω (ω with one element appended). Ordinal arithmetic is non-commutative; cardinal
  arithmetic is commutative for infinite cardinals.
