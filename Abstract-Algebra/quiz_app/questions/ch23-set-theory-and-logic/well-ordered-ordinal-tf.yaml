text: "Every well-ordered set is isomorphic (as an ordered set) to a unique ordinal."
answer: true
explanation: >
  This is the fundamental theorem of ordinals: every well-ordered set (W, ≤) is order-isomorphic to a unique ordinal α (where ordinals are themselves well-ordered by ∈). The uniqueness is because if α ≅ β as ordered sets then α = β (two distinct ordinals cannot be order-isomorphic). The existence requires transfinite recursion. The theorem justifies using ordinals as "canonical representatives" of well-order types.
