text: "The theory ACF₀ of algebraically closed fields of characteristic 0 is complete."
answer: true
explanation: >
  ACF₀ is complete: any two algebraically closed fields of characteristic 0 satisfy exactly the same first-order sentences. This follows from the Łoś–Vaught test (a theory that is categorical in some uncountable cardinality and has no finite models is complete): ACF₀ is categorical in every uncountable cardinality κ (since an algebraically closed field is determined by its characteristic and transcendence degree over its prime field, and cardinality determines the transcendence degree). Completeness of ACF₀ is the basis for quantifier elimination in algebraically closed fields.
