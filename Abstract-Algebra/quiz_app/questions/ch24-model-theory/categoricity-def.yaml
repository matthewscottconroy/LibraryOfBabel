difficulty: intermediate
explanation: T is κ-categorical when all models of cardinality κ are isomorphic (T
  is complete up to isomorphism at κ). By the Łoś–Vaught test, if T is κ-categorical
  for some κ ≥ |T|+ℵ₀ and has no finite models, then T is complete.
