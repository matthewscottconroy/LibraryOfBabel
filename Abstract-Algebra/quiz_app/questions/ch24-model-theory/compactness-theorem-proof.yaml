kind: proof
difficulty: advanced
text: >
  Compactness Theorem: A set of first-order sentences Σ has a model if and only if every finite subset of Σ has a model.
proof_lines:
  - "The 'only if' direction is trivial: any model of Σ satisfies every finite subset."
  - "For the 'if' direction, use ultraproducts. For each finite F ⊆ Σ, let M_F be a model of F (which exists by hypothesis). Consider the set I of all finite subsets of Σ, and for each φ ∈ Σ let Â(φ) = { F ∈ I : φ ∈ F }."
  - "The family { Â(φ) : φ ∈ Σ } has the finite intersection property because Â(φ₁) ∩ ... ∩ Â(φₙ) ⊇ Â({φ₁,...,φₙ}) ≠ ∅. By the existence of ___ (which follows from the Axiom of Choice), there exists an ultrafilter U on I containing all sets Â(φ)."
  - "Form the ultraproduct M = ∏_F M_F / U. By Łoś's theorem, M ⊨ φ if and only if { F : M_F ⊨ φ } ∈ U. For each φ ∈ Σ, the set { F : M_F ⊨ φ } ⊇ Â(φ) ∈ U, so M ⊨ ___."
  - "Therefore Σ has a model, namely the ultraproduct M."
fills:
  - "a non-principal ultrafilter extending any filter with the finite intersection property"
  - "φ"
explanation: >
  The two key blanks are the ultrafilter existence (which needs AC via the ultrafilter lemma, a weak form of AC) and the conclusion from Łoś's theorem that M satisfies each φ ∈ Σ. The ultraproduct construction is the central tool: Łoś's theorem says the ultraproduct satisfies exactly the sentences that "most" (in the ultrafilter sense) factors satisfy. The compactness theorem is equivalent to the ultrafilter lemma over ZF.
