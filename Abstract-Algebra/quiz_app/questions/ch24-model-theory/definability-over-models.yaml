explanation: 'In stable theories, every complete type tp(ā/M) over a model M is definable:
  for each formula φ(x̄,ȳ), there is a formula d_φ(ȳ) over M such that φ(ā,b̄) ↔ d_φ(b̄).
  Definability of types is equivalent to stability.'
