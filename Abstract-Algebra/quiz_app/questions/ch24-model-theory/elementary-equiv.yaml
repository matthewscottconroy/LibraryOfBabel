difficulty: intermediate
explanation: Elementary equivalence M ≡ N means Th(M) = Th(N). This is weaker than
  isomorphism. For example, all real-closed fields are elementarily equivalent to
  ℝ. Countable dense linear orders without endpoints are elementarily equivalent to
  (ℚ,<).
