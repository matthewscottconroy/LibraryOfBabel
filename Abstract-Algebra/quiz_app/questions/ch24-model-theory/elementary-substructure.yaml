kind: mc
difficulty: intermediate
text: 'A first-order structure M is an elementary substructure of N (M ≺ N) when:'
explanation: 'Elementary substructure: M ≺ N means M ⊆ N and M, N satisfy the same first-order properties
  of tuples in M.'
tags:
- elementary-substructure
choices:
- M ⊆ N and for every first-order formula φ, M ⊨ φ[ā] ↔ N ⊨ φ[ā]
- M is a subgroup of N
- M and N satisfy the same sentences
- there is an embedding M → N
answer: 0
