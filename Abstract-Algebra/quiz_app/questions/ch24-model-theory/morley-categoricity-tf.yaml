text: "A complete theory in a countable language that is categorical in some uncountable cardinality is categorical in all uncountable cardinalities."
answer: true
explanation: >
  This is Morley's theorem (1965): if a complete theory T in a countable language is κ-categorical for some uncountable κ, then T is κ-categorical for every uncountable κ. The proof uses the theory of prime and saturated models, Cantor–Bendixson rank on the type space, and a deep analysis of "totally transcendental" theories (ω-stable theories). Morley's theorem was a landmark result that initiated the modern classification theory of first-order theories (Shelah's stability theory).
