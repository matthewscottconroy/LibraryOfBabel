text: "A theory T has quantifier elimination if every first-order formula φ(x) is provably equivalent in T to a ___ formula."
choices:
  - "quantifier-free"
  - "universal"
explanation: >
  Quantifier elimination means every formula is T-equivalent to one with no quantifiers (∀, ∃). Key examples: the theory of algebraically closed fields (ACF) has QE in the language of rings; the theory of real closed fields (RCF) has QE in the language with an ordering (Tarski). QE has strong consequences: every definable set is a Boolean combination of basic open/closed sets (in the geometric sense), and the theory is model-complete. QE is often proved by testing it on existential formulas and using a back-and-forth argument.
