choices:
- The theory of algebraically closed fields ACF_p has QE in the language of rings
- The theory of groups has QE
- Peano Arithmetic has QE
- The theory of dense linear orders lacks QE
difficulty: advanced
explanation: ACF (algebraically closed fields) admits QE by Chevalley's theorem /
  Tarski–Seidenberg. QE implies model completeness (every substructure embedding is
  elementary) and completeness (for each characteristic). DLO (dense linear orders
  without endpoints) also has QE.
