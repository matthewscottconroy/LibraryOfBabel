text: "A model M of a theory T is κ-saturated if for every set A ⊆ M with |A| < κ, every ___ over A is realized in M."
choices:
  - "complete type p(x) ∈ S_n(A)"
  - "formula"
explanation: >
  A model M is κ-saturated if every type (complete consistent set of formulas) over a parameter set A of size < κ is realized by some element (or tuple) in M. Saturated models are "universal" in the sense that every smaller model of the same theory embeds elementarily. A κ⁺-saturated model of T of size κ is called saturated (without qualification). Saturated models exist under reasonable set-theoretic assumptions and are used to study the combinatorial structure of types in stability theory.
