text: "The complete type of an element a in a model M over a parameter set A (written tp(a/A)) is the set of all ___ φ(x) with parameters from A such that M ⊨ φ(a)."
choices:
  - "first-order formulas"
  - "quantifier-free formulas"
explanation: >
  The type tp(a/A) is the complete type of a over A: the set of all first-order formulas φ(x, ā) with parameters ā ∈ A such that M ⊨ φ(a, ā). It is a complete consistent theory in one free variable x over the parameter set A. The set of all complete types over A is denoted S₁(A) (or Sₙ(A) for n-tuples), and the study of the space of types — its cardinality, topology (Stone space), and structure — is the central concern of stability theory.
