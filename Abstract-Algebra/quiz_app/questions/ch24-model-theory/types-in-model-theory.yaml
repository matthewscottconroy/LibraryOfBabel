difficulty: intermediate
explanation: A complete type tp(ā/A) is the set of all L(A)-formulas φ(x̄) satisfied
  by ā in M. Types are the model-theoretic analog of generic points; the space S_n(A)
  of complete n-types over A is a Stone space.
