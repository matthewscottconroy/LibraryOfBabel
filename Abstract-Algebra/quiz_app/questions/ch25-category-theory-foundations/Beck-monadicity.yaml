explanation: 'Beck''s theorem: G: D → C is monadic iff G has a left adjoint F, G reflects
  isomorphisms, and D has (and G preserves) coequalizers of G-split pairs. This identifies
  when D is exactly the Eilenberg–Moore category for the monad GF.'
