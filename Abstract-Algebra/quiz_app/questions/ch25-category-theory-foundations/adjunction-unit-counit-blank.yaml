text: "An adjunction F ⊣ G between functors F: C → D and G: D → C consists of natural transformations η: Id_C → G∘F (the unit) and ε: F∘G → Id_D (the counit) satisfying the ___ identities: (Gε)(ηG) = id_G and (εF)(Fη) = id_F."
choices:
  - "triangle"
  - "monad"
explanation: >
  The triangle identities are the coherence conditions for an adjunction expressed via unit and counit: (G ε) ∘ (η G) = id_G (one triangle) and (ε F) ∘ (F η) = id_F (the other triangle). They are equivalent to the condition that the natural bijection Hom_D(F(c), d) ≅ Hom_C(c, G(d)) is natural in both c and d. An adjunction can equivalently be defined via this natural bijection or via the unit-counit data satisfying triangle identities.
