text: "Beck's Monadicity Theorem states that a functor G: D → C is monadic (D is equivalent to the Eilenberg–Moore category of algebras for the monad G∘F) if and only if G has a left adjoint F, G reflects isomorphisms, and D has ___ that G preserves and reflects."
choices:
  - "coequalizers of G-split pairs"
  - "all colimits"
explanation: >
  Beck's theorem characterizes monadic functors via three conditions: (1) G has a left adjoint; (2) G reflects isomorphisms; (3) D has coequalizers of G-split pairs (pairs (f,g) such that G(f) and G(g) have a split coequalizer in C), and G preserves these. A G-split pair is a pair of morphisms that G sends to a split (contractible) coequalizer. The theorem is used throughout algebra: the category of R-modules is monadic over Set, the category of compact Hausdorff spaces is monadic over Set, etc.
