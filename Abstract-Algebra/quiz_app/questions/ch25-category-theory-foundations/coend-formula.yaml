explanation: The coend ∫^c F(c,c) is the coequalizer of ∐_{f:c→c'} F(c',c) ⇒ ∐_c F(c,c)
  (two maps given by composition with f on each argument). The Yoneda lemma, tensor
  products of functors, and Day convolution are coend formulas.
