text: "Every functor F: C → E has a left Kan extension along any functor K: C → D."
answer: false
explanation: >
  Left Kan extensions do not always exist. They exist when E has enough colimits — specifically, when E is cocomplete and C is small, the pointwise left Kan extension always exists via the coend formula. But if E lacks the required colimits, or if C is large and size issues arise, Lan_K F may not exist. In contrast, if E is complete and C is small, right Kan extensions always exist. The question of existence is a primary consideration in applications of Kan extensions.
