text: "The left Kan extension Lan_K F of a functor F: C → E along K: C → D (when E is cocomplete) is given by the coend formula (Lan_K F)(d) = ___."
choices:
  - "∫^{c ∈ C} Hom_D(K(c), d) ⊗ F(c)"
  - "∫_{c ∈ C} F(c)^{Hom_D(d, K(c))}"
explanation: >
  The coend formula for the left Kan extension is (Lan_K F)(d) = ∫^c Hom_D(K(c), d) · F(c), where · denotes the copower (tensor with a set). This is the "weighted colimit" formula: it sums (via coend) all values F(c) weighted by how K(c) maps into d. The right Kan extension dually uses an end: (Ran_K F)(d) = ∫_c F(c)^{Hom_D(d,K(c))}. These formulas show that Kan extensions are the universal solutions to extending functors along K.
