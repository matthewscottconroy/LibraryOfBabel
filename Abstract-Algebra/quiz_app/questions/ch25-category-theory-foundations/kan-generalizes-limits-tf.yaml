text: "Limits and colimits are special cases of Kan extensions."
answer: true
explanation: >
  A limit of F: J → C is a right Kan extension of F along the unique functor J → 1 (to the terminal category), evaluated at the unique object of 1: lim F = (Ran_{!} F)(∗). Similarly, a colimit is a left Kan extension along J → 1: colim F = (Lan_{!} F)(∗). This is the sense in which "all concepts are Kan extensions" (Mac Lane's slogan). The universal property of limits/colimits is exactly the universal property of Kan extensions in this special case.
