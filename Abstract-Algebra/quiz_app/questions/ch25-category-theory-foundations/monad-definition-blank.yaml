text: "A monad on a category C is a triple (T, η, μ) where T: C → C is a functor, η: Id_C → T is the unit natural transformation, and μ: T² → T is the ___ natural transformation, satisfying the monoid axioms μ ∘ Tη = id = μ ∘ ηT and μ ∘ Tμ = μ ∘ μT."
choices:
  - "multiplication (monad multiplication)"
  - "counit"
explanation: >
  A monad (T, η, μ) consists of an endofunctor T with unit η: Id → T (the return/pure operation) and multiplication μ: T∘T → T (the join/bind operation). The axioms say: (1) μ ∘ η_T = id_T (left unit), (2) μ ∘ T(η) = id_T (right unit), (3) μ ∘ μ_T = μ ∘ T(μ) (associativity). These make T into a monoid in the monoidal category [C, C] of endofunctors. In computer science, monads encode computational effects via the Kleisli category.
