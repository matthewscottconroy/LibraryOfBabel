text: "The Yoneda lemma states that for any functor F: C → Set and any object c ∈ C, there is a natural bijection Nat(Hom_C(c, −), F) ≅ ___, natural in both c and F."
choices:
  - "F(c)"
  - "Hom(F(c), c)"
explanation: >
  The Yoneda lemma: Nat(Hom(c,−), F) ≅ F(c), naturally in c ∈ C and F: C → Set. The bijection sends a natural transformation η to η_c(id_c) ∈ F(c). Conversely, an element x ∈ F(c) determines a natural transformation by (η_d(f) = F(f)(x)) for f: c → d. The lemma implies the Yoneda embedding y: C → [C^op, Set], c ↦ Hom(−,c), is fully faithful — the category C embeds into its presheaf category via representable presheaves.
