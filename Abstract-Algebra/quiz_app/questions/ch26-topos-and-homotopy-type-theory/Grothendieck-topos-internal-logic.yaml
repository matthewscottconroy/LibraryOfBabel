explanation: 'The internal logic of a topos is intuitionistic: the subobject classifier
  Ω is a Heyting algebra, not necessarily Boolean. LEM holds iff Ω ≅ 1+1 (i.e., the
  topos is Boolean). Set has classical logic; sheaf toposes generally do not.'
