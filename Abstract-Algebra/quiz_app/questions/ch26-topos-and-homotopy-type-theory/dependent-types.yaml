explanation: '∏_{x:A} B(x) = ''for all x: A, B(x)'' — the type of dependent functions.
  When B is constant it reduces to A → B. The Σ-type Σ_{x:A} B(x) is the dependent
  sum (pairs), corresponding to ''there exists x: A such that B(x)''.'
