text: "Higher inductive types (HITs) in HoTT generalize ordinary inductive types by allowing constructors that produce not only ___ but also paths (elements of identity types) and higher paths."
choices:
  - "elements (point constructors)"
  - "propositions"
explanation: >
  Ordinary inductive types have only point constructors (e.g., zero : ℕ and succ : ℕ → ℕ for the naturals). HITs add path constructors: for example, the circle S¹ has a point constructor base : S¹ and a path constructor loop : base = base. The interval I has two points 0, 1 : I and a path connecting them. Quotient types A/R are HITs with a path constructor asserting R(a, b) → (a = b). HITs allow synthetic construction of standard spaces in algebraic topology purely within type theory.
