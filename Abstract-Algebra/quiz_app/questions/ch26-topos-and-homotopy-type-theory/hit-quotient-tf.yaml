text: "Higher inductive types can encode both ordinary inductive types (like ℕ) and quotient types (like ℤ = ℕ×ℕ/∼) within a single framework."
answer: true
explanation: >
  HITs subsume both. Ordinary inductive types arise as HITs with only point constructors and no path constructors. Quotient types A/R are HITs with the point constructor [·]: A → A/R and a path constructor quot: ∀a b, R(a,b) → ([a] = [b]). The integers ℤ can be defined as a quotient ℕ×ℕ/∼ where (a,b) ∼ (c,d) iff a+d = b+c, directly as a HIT. More broadly, HITs allow construction of all CW-complexes and simplicial sets synthetically, which is the foundation of synthetic homotopy theory in HoTT.
