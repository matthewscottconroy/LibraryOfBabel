explanation: 'An h-prop is a type where all identity types are contractible: ∀(a b:
  A), a = b. Sets are types where identity types are h-props (all paths between two
  points are equal). This gives a hierarchy: (-2)-types (contractible), (-1)-types
  (h-props), 0-types (sets), ...'
