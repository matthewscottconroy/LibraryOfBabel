explanation: 'Id_A(a,b) is inhabited iff a and b are (provably) equal in type A. In
  HoTT, paths (inhabitants of identity types) have higher structure: paths between
  paths (homotopies), paths between paths between paths, etc. This gives the ∞-groupoid
  structure.'
