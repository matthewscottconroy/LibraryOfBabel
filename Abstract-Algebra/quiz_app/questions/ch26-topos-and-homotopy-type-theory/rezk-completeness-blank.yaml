text: "A Segal space (simplicial space satisfying the Segal conditions) is called complete (a Rezk complete Segal space, or ∞-category) when the space of objects is equivalent to the ___ of the Segal space."
choices:
  - "classifying space of invertible morphisms (the core)"
  - "set of connected components"
explanation: >
  Rezk completeness: a Segal space X is complete when X₀ (the space of objects) → X_{hoequiv} (the subspace of equivalences in X₁) is an equivalence, where X_{hoequiv} is the union of path components corresponding to invertible 1-morphisms. This condition makes the homotopy theory internal (equivalences in the Segal space match paths in the object space). Complete Segal spaces provide a model for (∞,1)-categories, and Rezk's theorem shows they form a model category Quillen equivalent to quasi-categories (Lurie's model).
