kind: proof
difficulty: advanced
text: >
  Proof sketch that the Uniqueness of Identity Proofs (UIP) principle fails in HoTT: UIP asserts that for any type A and any a, b : A, any two proofs p, q : a =_A b are themselves equal (i.e., A is a set). HoTT refutes UIP in the universe U.
proof_lines:
  - "Consider the universe U (the type of all types). By the univalence axiom, there is an equivalence (A =_U B) ≃ (A ≃ B) for any A, B : U."
  - "Take A = B = 2 (the 2-element type {0, 1}). The type of equivalences 2 ≃ 2 has exactly ___ elements: the identity and the swap."
  - "Therefore the path type (2 =_U 2) also has exactly 2 elements (by the univalence equivalence). These two paths are ___ (they are distinct elements of the path type)."
  - "UIP would require all paths 2 =_U 2 to be equal (i.e., the type 2 =_U 2 to be contractible). But it has two distinct elements, so UIP fails for the universe U."
fills:
  - "2"
  - "not equal to each other"
explanation: >
  The argument uses univalence to compute the path space at a specific type: 2 ≃ 2 has exactly the identity equivalence and the swap equivalence, giving two distinct elements. Univalence then transports this to two distinct paths in the universe. UIP would collapse all paths to one, but the universe has genuine higher structure. This shows that HoTT's type theory is inherently homotopy-theoretic: types are not just sets but can be ∞-groupoids with nontrivial higher homotopy.
