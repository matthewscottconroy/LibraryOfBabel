text: "The Univalence Axiom (Voevodsky) asserts that the canonical map (A =_U B) → (A ≃ B), defined by transport, is itself ___."
choices:
  - "an equivalence of types"
  - "injective"
explanation: >
  The univalence axiom states that the canonical map ua: (A =_U B) → (A ≃ B) (sending the reflexivity path to the identity equivalence, and extended by transport) is an equivalence. Equivalently, there is an equivalence univalence: (A =_U B) ≃ (A ≃ B). This means "equivalent types are equal" in the universe, making the universe into an ∞-groupoid where paths = equivalences. Univalence is Voevodsky's key insight and cannot be proved in standard MLTT — it must be taken as an axiom or provided by a cubical type theory.
