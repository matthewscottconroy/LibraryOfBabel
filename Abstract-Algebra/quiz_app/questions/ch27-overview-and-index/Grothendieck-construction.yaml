explanation: 'The Grothendieck construction: ∫F has objects (c, x) with x ∈ F(c),
  and morphisms (c,x) → (d,y) are pairs (f: c→d, g: F(f)(x)→y). This gives a fibration
  ∫F → C and establishes the equivalence between fibrations over C and functors C
  → Cat.'
