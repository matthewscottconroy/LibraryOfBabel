text: "Chromatic homotopy theory organizes stable homotopy groups of spheres according to 'chromatic height,' with height 0 corresponding to rational homotopy theory and height 1 corresponding to complex K-theory."
answer: true
explanation: >
  The chromatic filtration stratifies the stable homotopy category by height (or Morava K-theory K(n)): height 0 gives rational homotopy (localization at HQ), height 1 recovers information related to K-theory (via the Adams e-invariant and J-homomorphism), and height n corresponds to Morava K(n)-local homotopy theory involving formal group laws of height n. The Chromatic Convergence Theorem (Hopkins–Ravenel) says the homotopy type of a finite complex is the homotopy limit of its chromatic localizations, making the hierarchy complete.
