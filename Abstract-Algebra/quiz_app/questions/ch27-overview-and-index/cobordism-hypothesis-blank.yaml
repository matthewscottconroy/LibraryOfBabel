text: "The Cobordism Hypothesis (Baez–Dolan, proved by Lurie) classifies fully extended framed topological field theories: a fully extended n-dimensional framed TFT with values in a symmetric monoidal (∞,n)-category C is completely determined by ___."
choices:
  - "its value on the point (a fully dualizable object of C)"
  - "its value on the n-sphere"
explanation: >
  The Cobordism Hypothesis states that the ∞-category of fully extended framed n-dimensional TFTs with target C is equivalent to the ∞-groupoid of fully dualizable objects in C. A fully dualizable object has duals at every level (dual, dual of the unit, etc.). This means specifying a TFT reduces to specifying a single object in C satisfying dualizability conditions. The result, proved by Lurie using ∞-category theory, is a sweeping generalization of the Atiyah–Segal axioms and ties together topology, higher category theory, and quantum field theory.
