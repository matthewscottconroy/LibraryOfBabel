text: "Étale cohomology provides ℓ-adic realizations of motives, realizing the Weil cohomology axioms for algebraic varieties over arbitrary fields."
answer: true
explanation: >
  For a smooth projective variety X over a field k and a prime ℓ ≠ char(k), the étale cohomology H^n_{ét}(X_k̄, ℚ_ℓ) provides a Weil cohomology theory with ℓ-adic coefficients. Grothendieck's conjectural theory of motives posits a universal Weil cohomology through which all others factor; étale cohomology gives the ℓ-adic realization of this universal object. The Weil conjectures (proved by Deligne) are the deep arithmetic consequences of this cohomological framework.
