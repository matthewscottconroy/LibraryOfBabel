explanation: 'Multiple equivalent models of (∞,1)-categories exist: Lurie''s quasicategories
  (simplicial sets with inner horn filling), Rezk''s complete Segal spaces, Segal
  categories, and simplicially enriched categories. All are Quillen equivalent, with
  quasicategories being most commonly used in HTT/HA.'
