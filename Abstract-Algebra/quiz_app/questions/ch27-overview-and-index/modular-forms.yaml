text: 'A modular form of weight k for SL₂(ℤ) is a holomorphic function f: ℍ → ℂ satisfying
  f((aτ+b)/(cτ+d)) = (cτ+d)^k f(τ) for all [[a,b],[c,d]] ∈ SL₂(ℤ), and holomorphic
  at the cusps. The space M_k has dimension:'
