explanation: dim M_k is computed via Riemann–Roch on X(1) = ℍ/SL₂(ℤ) ∪ {∞} (a genus-0
  curve). Cusp forms S_k have dim M_k − 1. The Hecke operators make M_k into a module
  over the Hecke algebra; eigenforms are the building blocks of the Langlands program.
