[package]
name = "quiz-web"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "quiz-web"
path = "src/main.rs"

[dependencies]
quiz-core = { path = "../quiz-core" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
