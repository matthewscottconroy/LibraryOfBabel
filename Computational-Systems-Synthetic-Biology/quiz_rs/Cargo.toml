[package]
name = "quiz_rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "quiz_rs"
path = "src/main.rs"

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
uuid       = { version = "1", features = ["v4"] }
chrono     = { version = "0.4", features = ["serde"] }
rand       = "0.8"
clap       = { version = "4", features = ["derive"] }
reqwest    = { version = "0.12", features = ["json", "blocking"] }
sha2       = "0.10"
hex        = "0.4"
dirs       = "5"
