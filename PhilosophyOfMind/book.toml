# Build manifest for the Philosophy of Mind textbook.
# Twenty NN_* domain directories recurse into Unit_XX/ChXX_/NN_ leaves.
# 00-unit-introduction.md sorts first (00-*.md intro) and
# connections-to-empirical-research.md is captured as ordinary content.
title = "Philosophy of Mind"
subtitle = "From the Mind-Body Problem to Artificial Minds"

front_matter = [
    "READING-PATHS.md",
]
exclude = [
    "README.md",
]

[[sources]]
root = "."
recursive = true
part_level = 1   # 01_Foundations .. 20_Methodology become \part
