# Build manifest for the Telecommunications textbook.
#
# Layout: book/unit_NN_<slug>/chNN_<slug>/{chapter_intro.md, sNN_<slug>.md,
# exercises.md, important_concepts.md, important_researchers.md,
# further_reading.md}, with unit_intro.md opening each unit and an appendices/
# directory at the end.
#
# labs/, tools/, project/ and instructor/ are companion assets and are
# deliberately NOT part of the PDF; they are excluded from the build by living
# outside the `book` source root.
title = "Telecommunications"
subtitle = "From Signals to the Internet, Built from First Principles"

front_matter = [
    "book/README.md",
    "book/preface.md",
]

# Chapter back matter, in the order a chapter should close. Without this the
# build sorts each chapter directory alphabetically, which puts exercises.md and
# further_reading.md ahead of s01_*.md — the exercises before the sections they
# examine, and the reading list before the reading. "appendices" (a directory)
# sorts the appendix part after the units, which alphabetical order would not.
outro_names = [
    "exercises.md",
    "important_concepts.md",
    "important_researchers.md",
    "further_reading.md",
    "appendices",
]

# The book numbers itself ("Chapter 1 —", "1.1", "Appendix A —"), so LaTeX
# numbering on top would double it ("Chapter 2: Chapter 1 — ...").
numbersections = false

# chapter_intro.md becomes the chapter heading with its sections beneath it;
# unit_intro.md merges into the \part its H1 already titles.
lift_intros = true

# Front matter renders as chapters, not as Parts I and II.
front_matter_shift = 1

# The default Latin Modern fonts silently drop every Greek letter in prose
# and every box-drawing character in the ASCII diagrams. Noto covers the
# book's entire character inventory (verified char-by-char); the mono scale
# keeps 80-column diagrams inside the text width.
# (Noto's variable-font files crash xdvipdfmx, so static faces are used.)
mainfont = "TeX Gyre Pagella"
monofont = "Source Code Pro"
monofontoptions = ["Scale=0.84"]

# The TOC lists parts and chapters only. toc_depth cannot go below 1
# (pandoc), so section-level TOC lines are suppressed in the preamble.
toc_depth = 1
header_includes = [
  '''
\makeatletter
\renewcommand{\l@section}[2]{}
\makeatother
''',
  # Pagella lacks Unicode sub/superscripts and the deliberate
  # foreign-script examples (the Pike & Thompson title, the homograph
  # and mojibake demonstrations). Each such character is made active
  # and rendered as a true LaTeX sub/superscript, or in a fallback
  # font for the foreign scripts.
  '''
\newfontfamily\fallbackfont{Droid Sans Japanese}
\newfontfamily\fallbackalpha{Droid Sans}
\catcode`\ᴳ=\active \defᴳ{\ifmmode ^{G}\else\textsuperscript{G}\fi}
\catcode`\ᵏ=\active \defᵏ{\ifmmode ^{k}\else\textsuperscript{k}\fi}
\catcode`\⁰=\active \def⁰{\ifmmode ^{0}\else\textsuperscript{0}\fi}
\catcode`\⁴=\active \def⁴{\ifmmode ^{4}\else\textsuperscript{4}\fi}
\catcode`\⁵=\active \def⁵{\ifmmode ^{5}\else\textsuperscript{5}\fi}
\catcode`\⁶=\active \def⁶{\ifmmode ^{6}\else\textsuperscript{6}\fi}
\catcode`\⁷=\active \def⁷{\ifmmode ^{7}\else\textsuperscript{7}\fi}
\catcode`\⁸=\active \def⁸{\ifmmode ^{8}\else\textsuperscript{8}\fi}
\catcode`\⁹=\active \def⁹{\ifmmode ^{9}\else\textsuperscript{9}\fi}
\catcode`\ⁿ=\active \defⁿ{\ifmmode ^{n}\else\textsuperscript{n}\fi}
\catcode`\⁻=\active \def⁻{\ifmmode ^{-}\else\textsuperscript{−}\fi}
\catcode`\ᵢ=\active \defᵢ{\ifmmode _{i}\else\textsubscript{i}\fi}
\catcode`\₀=\active \def₀{\ifmmode _{0}\else\textsubscript{0}\fi}
\catcode`\₁=\active \def₁{\ifmmode _{1}\else\textsubscript{1}\fi}
\catcode`\₂=\active \def₂{\ifmmode _{2}\else\textsubscript{2}\fi}
\catcode`\ₐ=\active \defₐ{\ifmmode _{a}\else\textsubscript{a}\fi}
\catcode`\ₓ=\active \defₓ{\ifmmode _{x}\else\textsubscript{x}\fi}
\catcode`\ₘ=\active \defₘ{\ifmmode _{m}\else\textsubscript{m}\fi}
\catcode`\έ=\active \defέ{{\fallbackalpha\char"03AD }}
\catcode`\ό=\active \defό{{\fallbackalpha\char"03CC }}
\catcode`\Щ=\active \defЩ{{\fallbackalpha\char"0429 }}
\catcode`\а=\active \defа{{\fallbackalpha\char"0430 }}
\catcode`\こ=\active \defこ{{\fallbackfont\char"3053 }}
\catcode`\ち=\active \defち{{\fallbackfont\char"3061 }}
\catcode`\に=\active \defに{{\fallbackfont\char"306B }}
\catcode`\は=\active \defは{{\fallbackfont\char"306F }}
\catcode`\ん=\active \defん{{\fallbackfont\char"3093 }}
\catcode`\世=\active \def世{{\fallbackfont\char"4E16 }}
\catcode`\界=\active \def界{{\fallbackfont\char"754C }}
''',
]

[[sources]]
root = "book"
recursive = true
part_level = 1   # unit_01 .. unit_14 and appendices/ become \part
